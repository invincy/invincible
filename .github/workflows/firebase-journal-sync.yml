name: Deploy Journal sync fix

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Recover current hosted app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .firebase-deploy/public
          curl -fsSL https://life-by-adichimp.web.app/ -o .firebase-deploy/public/index.html
          script_path=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' .firebase-deploy/public/index.html | head -1)
          css_path=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.css' .firebase-deploy/public/index.html | head -1)
          test -n "$script_path"
          test -n "$css_path"
          mkdir -p .firebase-deploy/public/assets
          curl -fsSL "https://life-by-adichimp.web.app$script_path" -o ".firebase-deploy/public$script_path"
          curl -fsSL "https://life-by-adichimp.web.app$css_path" -o ".firebase-deploy/public$css_path"

      - name: Fix authenticated Journal path
        shell: bash
        run: |
          set -euo pipefail
          script_file=$(find .firebase-deploy/public/assets -name 'index-*.js' -print -quit)
          grep -F 'HP(y,"users",l.uid,"journals",t,"strokes")' "$script_file"
          perl -0pi -e 's/HP\(y,"users",l\.uid,"journals",t,"strokes"\)/HP(y,"users",w.uid,"journals",t,"strokes")/' "$script_file"
          grep -F 'HP(y,"users",w.uid,"journals",t,"strokes")' "$script_file"
          if grep -Fq 'HP(y,"users",l.uid,"journals",t,"strokes")' "$script_file"; then
            echo "Old null-UID path remains" >&2
            exit 1
          fi
          cat > .firebase-deploy/firebase.json <<'JSON'
          {
            "hosting": {
              "site": "life-by-adichimp",
              "public": "public",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{"source": "**", "destination": "/index.html"}]
            }
          }
          JSON

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFE_BY_ADICHIMP }}
          projectId: life-by-adichimp
          channelId: live
          entryPoint: .firebase-deploy
