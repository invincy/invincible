  <style>
    :root {
      --neon:#00ffff;
      --bg-color:#000;
      --accent-color:#00ffff;
      --subtle-color:#003333;

      --panel-border:1px solid rgba(0,255,255,.2);
      --panel-shadow:0 0 15px rgba(0,255,255,.2);
    }

    /* Mission dashboard: Current Focus replaces the Today lane. */
    .legacy-dashboard-widgets{display:none!important}
    #dashboard{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:0;width:100%;height:calc(100vh - 58px);padding:.65rem 1.5rem 1.25rem;overflow:hidden}
    #top-bar{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:.3rem 0 .6rem;background:transparent;border:0;border-radius:0;box-shadow:none}
    #controls-row{display:flex;align-items:center;padding:0}
    #time-and-date-row{display:flex;align-items:center;gap:1rem;padding:0}
    .header-clock{display:flex;flex-direction:column;align-items:flex-end;min-width:120px;font-family:Orbitron,sans-serif}
    .header-clock .time{width:auto;font-size:1.55rem;line-height:1;color:#55efff;animation:none}
    .header-clock .date{margin-top:.2rem;font:600 .62rem 'Exo 2',sans-serif;color:#91b8bd}
    .controls{gap:.55rem}.add-task-btn{min-height:34px;padding:.42rem .72rem;border-radius:.45rem;font-size:.72rem}
    #mission-layout{grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(430px,1.05fr) minmax(560px,1.3fr);grid-template-rows:minmax(335px,.88fr) minmax(185px,.58fr);column-gap:2rem;row-gap:.5rem;min-height:0;position:relative}
    #focus-panel{grid-column:1;grid-row:1/-1;display:grid;grid-template-columns:minmax(330px,1fr) minmax(225px,.7fr);align-items:center;gap:.3rem;min-height:0;padding:0;background:transparent;border:0;box-shadow:none;overflow:visible}
    #focus-panel:before{display:none}
    .focus-orb-stage{position:relative;width:min(34vw,460px);height:min(34vw,460px);min-width:350px;min-height:350px;display:grid;place-items:center;isolation:isolate}
    .focus-orb{position:relative;width:clamp(280px,22vw,334px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 50% 46%,rgba(47,38,16,.74) 0 24%,rgba(12,31,34,.9) 57%,rgba(2,15,20,.72) 72%);box-shadow:inset 0 0 55px rgba(255,205,99,.16),0 0 42px rgba(255,191,65,.13);z-index:2}
    .focus-orb:before,.focus-orb:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
    .focus-orb:before{inset:8%;border:1px solid rgba(255,224,153,.55);box-shadow:0 0 18px rgba(255,198,84,.22),inset 0 0 20px rgba(89,225,245,.08);animation:orb-breathe 5s ease-in-out infinite}
    .focus-orb:after{inset:20%;border:1px dashed rgba(120,230,242,.28);animation:orb-turn 36s linear infinite reverse}
    .orb-svg{position:absolute;inset:-5%;width:110%;height:110%;overflow:visible;filter:drop-shadow(0 0 5px rgba(255,213,121,.35));transform:rotate(-90deg)}
    .orb-track{fill:none;stroke:rgba(255,255,255,.09);stroke-width:1.3}
    .orb-progress,.orb-progress-glow{fill:none;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
    .orb-progress{stroke:url(#orb-gradient);stroke-width:7;filter:drop-shadow(0 0 2px #b9fbff) drop-shadow(0 0 7px rgba(53,225,235,.68));animation:progress-shimmer 4.2s ease-in-out infinite}
    .orb-progress-glow{stroke:#58e5ed;stroke-width:14;opacity:.14;filter:blur(4px)}
    .orb-ring{position:absolute;inset:-3%;border:1px solid rgba(255,215,127,.5);border-radius:50%;animation:orb-turn 48s linear infinite}
    .orb-ring.two{inset:13%;border-color:rgba(112,220,255,.27);border-style:dashed;animation-duration:31s;animation-direction:reverse}
    .orb-ring.three{inset:25%;border-color:rgba(255,231,174,.3);transform:rotate(64deg) scaleY(.64);animation:orb-wobble 20s ease-in-out infinite}
    .orb-particles{position:absolute;inset:2%;border-radius:50%;background-image:radial-gradient(circle,#ffe3a1 0 1px,transparent 1.5px),radial-gradient(circle,#65eaff 0 1px,transparent 1.5px),radial-gradient(circle,#fff 0 .8px,transparent 1.2px);background-size:47px 53px,61px 43px,37px 71px;background-position:8px 4px,20px 16px,31px 28px;opacity:.45;mask-image:radial-gradient(circle,transparent 0 38%,#000 42% 72%,transparent 76%);animation:orb-turn 58s linear infinite}
    .orb-copy{position:relative;z-index:3;width:67%;text-align:center}
    .focus-kicker{font-size:.66rem;letter-spacing:.18em;color:#ebc878}
    .focus-title{margin:.5rem 0 0;font:900 clamp(1.15rem,1.7vw,1.55rem)/1.14 'Exo 2',sans-serif;color:#fff0bd;text-wrap:balance;text-shadow:0 0 14px rgba(255,202,82,.24)}
    .focus-detail{display:none}
    .hud-readout{position:absolute;z-index:4;color:#dce9e9;font-family:'Exo 2',sans-serif;text-transform:uppercase;letter-spacing:.04em}
    .hud-readout small{display:block;color:#eacb87;font-size:.58rem;font-weight:800}.hud-readout strong{display:block;margin-top:.16rem;color:#fff0bd;font-size:.82rem;line-height:1.2;text-transform:none;letter-spacing:0}
    .hud-readout:after{content:"";position:absolute;height:1px;background:linear-gradient(90deg,rgba(255,216,126,.75),rgba(112,220,255,.42))}
    .hud-next{left:0;top:18%;width:126px;text-align:right}.hud-next:after{left:calc(100% + 9px);top:20px;width:58px;transform:rotate(18deg);transform-origin:left}
    .hud-progress{right:0;top:25%;width:76px}.hud-progress strong{font:900 1.25rem Orbitron,sans-serif}.hud-progress:after{right:calc(100% + 8px);top:18px;width:54px}
    .hud-subtasks{left:11%;bottom:15%;width:100px;text-align:right}.hud-subtasks:after{left:calc(100% + 8px);top:18px;width:47px;transform:rotate(-20deg);transform-origin:left}
    .focus-control-cluster{align-self:center;display:grid;gap:.58rem;width:min(100%,280px);padding:.8rem;border:1px solid rgba(112,220,255,.24);border-radius:.55rem;background:linear-gradient(145deg,rgba(7,35,40,.8),rgba(4,19,24,.7));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 12px 32px rgba(0,0,0,.2)}
    .focus-eyebrow-row{margin-bottom:-.15rem}.focus-state{font-size:.55rem}
    .focus-session{display:grid;grid-template-columns:1fr;gap:.12rem;padding:.15rem 0 .65rem;border:0;border-bottom:1px solid rgba(255,224,138,.18);background:transparent}
    .focus-timer{font-size:2rem;line-height:1}.focus-start{min-width:0;min-height:34px;margin-top:.35rem;font-size:.7rem;border-radius:.45rem}
    .focus-actions{gap:.35rem}.focus-quick{min-height:31px;font-size:.66rem;border-radius:.4rem}.focus-links{gap:.4rem}.focus-links .focus-action{min-height:32px;border-radius:.4rem;font-size:.68rem;box-shadow:none}.focus-change{min-height:32px;font-size:.66rem;border-radius:.4rem}
    .focus-note,.focus-steps,.focus-progress{display:none!important}
    body.desktop-focus-active .focus-orb{box-shadow:inset 0 0 65px rgba(255,205,99,.22),0 0 55px rgba(255,191,65,.25)}
    body.desktop-focus-active .orb-ring{animation-duration:28s;border-color:rgba(255,222,146,.75)}
    body.desktop-focus-active .orb-ring.two{animation-duration:20s}
    #focus-panel.energy-pulse .focus-orb{animation:orb-pulse .7s ease-out}
    #kanban-container{grid-column:2;grid-row:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:1rem;overflow:visible;padding-top:8rem;min-height:0}
    .kanban-column{min-width:0;max-width:none;max-height:calc(100vh - 235px);padding:.55rem .4rem;background:rgba(3,23,28,.48);border:1px solid color-mix(in srgb,var(--status-accent) 28%,transparent);border-radius:.45rem;box-shadow:none;backdrop-filter:blur(8px)}
    .kanban-column h2{justify-content:flex-start;min-height:36px;margin:0 0 .45rem;padding:.35rem .45rem;border:0;border-bottom:1px solid color-mix(in srgb,var(--status-accent) 34%,transparent);border-radius:0;background:transparent;font-size:.76rem;letter-spacing:.04em}
    .kanban-column h2::after{min-width:1.1rem;height:1.1rem;margin-left:.15rem;border-width:1px;font-size:.56rem}
    .task-list{gap:.48rem;padding:0 .2rem;overflow-y:auto}.task-card{padding:.72rem .55rem .55rem;padding-top:1.35rem;border-color:color-mix(in srgb,var(--status-accent) 32%,transparent);border-radius:.4rem;background:rgba(3,17,21,.72)}
    .task-card h3{font-size:.78rem;margin-bottom:.2rem}.task-card .subtask-count{font-size:.64rem}.card-nav{top:4px;right:5px;gap:3px}.card-nav button{width:16px;height:16px;border-radius:4px;font-size:.62rem}
    #kanban-backlog{background:rgba(35,38,42,.3);border-color:rgba(208,211,214,.22)}#kanban-in-progress{background:rgba(9,49,67,.32);border-color:rgba(40,139,176,.35)}#kanban-done{background:rgba(11,49,37,.3);border-color:rgba(52,126,96,.35)}
    @keyframes orb-turn{to{transform:rotate(360deg)}}
    @keyframes orb-wobble{0%,100%{transform:rotate(64deg) scaleY(.64)}50%{transform:rotate(84deg) scaleY(.72)}}
    @keyframes orb-breathe{0%,100%{opacity:.6;transform:scale(.99)}50%{opacity:1;transform:scale(1.015)}}
    @keyframes orb-pulse{0%{filter:brightness(1)}45%{filter:brightness(1.65);box-shadow:0 0 70px rgba(255,204,92,.5)}100%{filter:brightness(1)}}
    @keyframes progress-shimmer{0%,100%{filter:drop-shadow(0 0 2px #b9fbff) drop-shadow(0 0 5px rgba(53,225,235,.55))}50%{filter:drop-shadow(0 0 3px #e7feff) drop-shadow(0 0 10px rgba(53,225,235,.82))}}
    @media (max-width:1180px){#mission-layout{grid-template-columns:minmax(390px,.9fr) minmax(500px,1.2fr)}#focus-panel{grid-template-columns:1fr;grid-template-rows:350px auto}.focus-orb-stage{align-self:start;width:100%;height:350px}.focus-orb{width:300px}.focus-control-cluster{position:static;transform:none;width:260px;margin:-.35rem auto 0}.hud-subtasks{bottom:9%}#kanban-container{padding-top:5rem}}
    @media (max-width:1024px){html,body{height:auto;overflow-x:hidden;overflow-y:auto}#dashboard{height:auto;min-height:calc(100vh - 54px);padding:.75rem}#top-bar{display:flex}#mission-layout{display:flex;flex-direction:column;gap:1rem}.focus-panel{display:flex!important;flex-direction:column;padding:.5rem 0}.focus-orb-stage{width:100%;height:390px;min-width:0}.focus-control-cluster{position:static;transform:none;width:min(92%,420px);align-self:center}.hud-next{left:5%}.hud-progress{right:5%}.hud-subtasks{left:9%;bottom:12%}#kanban-container{display:flex;flex-direction:column;padding-top:0;gap:.75rem}.kanban-column{width:100%;max-height:none;min-height:120px}.task-list{overflow:visible}.focus-note{display:none!important}}
    @media (max-width:620px){#dashboard{padding:.5rem}.streaks{display:none}.header-clock .time{font-size:1.18rem}.header-clock .date{font-size:.5rem}.add-task-btn{font-size:.65rem}.focus-orb-stage{height:340px}.focus-orb{width:270px}.hud-next{left:0;top:10%;width:105px}.hud-progress{right:0;top:16%}.hud-subtasks{left:2%;bottom:9%}.hud-readout:after{display:none}.focus-title{font-size:1.08rem}#kanban-container{display:grid;grid-template-columns:1fr}.kanban-column{display:flex}.kanban-column h2{font-size:.72rem}}
    @media (prefers-reduced-motion:reduce){.orb-ring,.orb-particles,.focus-orb:before,.focus-orb:after{animation:none!important}}

    html,body{height:100%;margin:0;overflow:hidden;font-family:Roboto,system-ui,Arial,sans-serif;font-size:17px;font-weight:500;color:var(--font-color);background:var(--bg-color)}
    body{display:flex;flex-direction:column;position:relative}

    /* Particles */
    #particles-js{position:absolute;inset:0;z-index:1;opacity:.5}

    /* Cards */
    .task-card{position:relative;padding:1.2rem 1rem .9rem;padding-top:2rem;overflow:visible;background:color-mix(in srgb,var(--status-accent,var(--accent-color)) 7%,transparent);border:1px solid color-mix(in srgb,var(--status-accent,var(--accent-color)) 48%,transparent);border-radius:.5rem;color:var(--status-accent,var(--accent-color));transition:.15s}
    .task-card:hover{transform:translateY(-2px);border-color:var(--status-accent,var(--accent-color));box-shadow:0 0 14px color-mix(in srgb,var(--status-accent,var(--accent-color)) 32%,transparent)}
    .task-card h3{margin:0 0 .4rem;font-family:'Exo 2',Roboto,sans-serif;font-size:1.32rem;font-weight:700;line-height:1.2;letter-spacing:.005em;color:var(--status-accent,var(--accent-color));text-shadow:0 1px 0 #000}
    .task-card .subtask-count{font-size:1.08rem;font-weight:700;line-height:1.4;opacity:1;color:color-mix(in srgb,var(--status-accent,var(--accent-color)) 82%,white)}
    .task-card.dragging{opacity:.5;transform:scale(.98)}

    .task-card.is-focus-task{border-color:var(--status-accent,#ffe08a);background:linear-gradient(145deg,rgba(255,224,138,.12),rgba(0,0,0,.08));box-shadow:0 0 22px color-mix(in srgb,var(--status-accent,#ffe08a) 28%,transparent)}
    .task-card.is-focus-task:before{content:"NEXT";position:absolute;left:10px;top:7px;padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--status-accent,#ffe08a) 18%,transparent);border:1px solid color-mix(in srgb,var(--status-accent,#ffe08a) 45%,transparent);color:var(--status-accent,#ffe08a);font:700 9px Orbitron,sans-serif;letter-spacing:.1em}
    .focus-panel{display:grid;grid-template-columns:1fr;gap:.75rem;align-items:center;min-height:0;padding:1rem;border:1px solid rgba(255,209,102,.48);border-radius:.75rem;background:radial-gradient(circle at 88% 18%,rgba(255,209,102,.18),transparent 13rem),linear-gradient(145deg,rgba(58,43,13,.96),rgba(7,27,30,.94));box-shadow:0 0 34px rgba(255,184,38,.16),inset 0 1px 0 rgba(255,245,204,.16);position:relative;z-index:3;overflow:hidden}
    .focus-panel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#ffe08a,#70dcff);box-shadow:0 0 18px rgba(255,224,138,.55)}
    .focus-kicker{font:700 11px Orbitron,sans-serif;letter-spacing:.18em;color:#ffe08a;text-transform:uppercase}
    .focus-title{margin:.5rem 0 .35rem;font-size:1.8rem;line-height:1.08;color:#fff4cc;text-shadow:0 0 16px rgba(255,209,102,.22)}
    .focus-detail{margin:0;color:#e3f0f0;font-size:1.18rem;font-weight:800;line-height:1.35}
    .focus-progress{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-width:0}
    .focus-meter{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
    .focus-meter span{display:block;width:0;height:100%;background:linear-gradient(90deg,#ffe08a,#83dfb4);transition:width .25s}
    .focus-percent{font:700 1.35rem Orbitron,sans-serif;color:#83dfb4}
    .focus-action{grid-column:1/-1;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border:1px solid #ffe08a;border-radius:.75rem;background:#ffe08a;color:#151006;font-weight:800;text-decoration:none;box-shadow:0 12px 30px rgba(255,184,38,.18)}
    .focus-action:hover{transform:translateY(-1px);box-shadow:0 16px 38px rgba(255,184,38,.28)}

    /* Desktop task controller */
    .focus-eyebrow-row,.focus-session,.focus-actions,.focus-links{display:flex;align-items:center}
    .focus-eyebrow-row{justify-content:space-between;gap:.75rem}
    .focus-state{padding:.25rem .5rem;border:1px solid rgba(255,224,138,.35);border-radius:999px;color:#fff0b8;font:800 .65rem 'Exo 2',sans-serif;text-transform:uppercase;letter-spacing:.08em}
    .focus-next-label{margin:.75rem 0 .25rem;color:#ffe08a;font-size:.86rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em}
    .focus-session{justify-content:space-between;gap:.75rem;padding:.75rem;border-radius:.65rem;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.09)}
    .focus-timer{font:900 2.35rem Orbitron,sans-serif;color:#fff4cc;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,209,102,.3)}
    .focus-start{min-width:118px;min-height:44px;border:1px solid #ffe08a;border-radius:.65rem;background:#ffe08a;color:#151006;font:900 .82rem 'Exo 2',sans-serif;letter-spacing:.06em;cursor:pointer}
    .focus-start.is-running{background:rgba(255,224,138,.1);color:#ffe08a}
    .focus-steps{display:flex;flex-direction:column;gap:.42rem;max-height:150px;overflow:auto}
    .focus-step{display:flex;align-items:center;gap:.65rem;width:100%;padding:.68rem .72rem;border:1px solid rgba(255,255,255,.09);border-radius:.55rem;background:rgba(0,0,0,.16);color:#dce9e9;text-align:left;font-size:1rem;font-weight:800;cursor:pointer}
    .focus-step:hover{border-color:rgba(255,224,138,.4)}
    .focus-step.is-done{opacity:.55;text-decoration:line-through}
    .focus-step.is-next{border-color:rgba(255,224,138,.5);color:#fff0b8}
    .focus-step-marker{display:grid;place-items:center;flex:0 0 22px;height:22px;border-radius:50%;border:1px solid currentColor;font-size:.68rem}
    .focus-note{width:100%;min-height:58px;resize:vertical;box-sizing:border-box;padding:.6rem .7rem;border-radius:.55rem;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.22);color:#eef7f7;font:600 .82rem Roboto,sans-serif}
    .focus-actions{gap:.45rem}
    .focus-quick{flex:1;min-height:38px;border-radius:.55rem;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#e9f5f5;font-weight:800;cursor:pointer}
    .focus-quick:hover{border-color:#ffe08a;color:#fff0b8}
    .focus-quick.done{border-color:rgba(131,223,180,.45);color:#83dfb4}
    .focus-quick.blocked{border-color:rgba(255,130,130,.35);color:#ffaaaa}
    .focus-links{gap:.5rem}
    .focus-links .focus-action{flex:1;min-height:38px;font-size:.8rem}
    .focus-change{min-height:38px;padding:0 .7rem;border:1px solid rgba(112,220,255,.35);border-radius:.65rem;background:rgba(112,220,255,.06);color:#70dcff;font-weight:800;cursor:pointer}
    .task-card.is-selected{outline:2px solid #fff0b8;outline-offset:2px;box-shadow:0 0 26px rgba(255,224,138,.32)}
    .task-card.is-completing{animation:task-complete .48s ease both}
    @keyframes task-complete{50%{transform:scale(1.04);filter:brightness(1.45)}100%{transform:translateX(28px);opacity:0}}
    .kanban-column.is-drag-target{transform:translateY(-4px);border-color:var(--status-accent)!important;box-shadow:0 0 34px color-mix(in srgb,var(--status-accent) 45%,transparent)!important}
    .kanban-column.is-drag-target .task-list:after{content:"DROP TASK HERE";display:grid;place-items:center;min-height:70px;margin:.25rem .5rem;border:2px dashed var(--status-accent);border-radius:.55rem;color:var(--status-accent);font:800 .72rem Orbitron,sans-serif;letter-spacing:.08em;background:color-mix(in srgb,var(--status-accent) 8%,transparent)}
    body.desktop-focus-active #kanban-container .task-card:not(.is-selected){opacity:.42;filter:saturate(.65)}
    body.desktop-focus-active #particles-js{opacity:.18}

    @media (min-width:1025px){
      #left-info{overflow-y:auto}
      .focus-panel{align-items:stretch;gap:.9rem}
      #focus-detail,.focus-note{display:none}
      .focus-actions{gap:.6rem}
      .focus-quick{min-height:44px;font-size:.92rem}
    }

    /* Card arrows */
    .card-nav{position:absolute;top:6px;right:8px;display:flex;gap:6px;z-index:10}
    .card-nav button{display:inline-grid;place-items:center;height:22px;width:22px;background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.35);color:var(--accent-color);border-radius:6px;cursor:pointer;box-shadow:0 0 6px rgba(0,255,255,.25)}
    .card-nav button:hover{background:rgba(0,255,255,.18)}
    .card-nav button:disabled{opacity:.35;cursor:default}

    /* Layout */
    #dashboard{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,19vw,370px);grid-template-rows:auto minmax(0,1fr);width:100vw;height:100vh;padding:1.25rem 1.5rem 1.5rem;box-sizing:border-box;gap:1.25rem;position:relative;z-index:2}
    #mobile-overview{display:contents}
    #top-bar{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:1rem;padding:.7rem 1.25rem;background:var(--panel-bg);border-radius:.75rem;border:var(--panel-border);box-shadow:var(--panel-shadow);z-index:10}
    #time-and-date-row{grid-column:2;grid-row:1;display:flex;justify-content:flex-end;align-items:center}
    #controls-row{grid-column:1;grid-row:1;display:flex;justify-content:space-between;align-items:center;padding:0;border:0;margin:0}

    /* The global navigation already carries the product name. */
    #app-title{display:none}

    .controls{display:flex;align-items:center;gap:1rem}
    .add-task-btn{font-family:'Exo 2',Roboto,sans-serif;font-weight:700;background:transparent;color:var(--accent-color);border:1px solid var(--accent-color);padding:.6rem .9rem;border-radius:.75rem;font-size:1rem;cursor:pointer;transition:.2s;text-shadow:0 0 5px var(--glow-color)}
    .add-task-btn:hover{background:rgba(0,255,255,.1);box-shadow:0 0 10px rgba(0,255,255,.5)}
    .top-current-focus{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:1rem;width:min(760px,82%);min-width:0;margin:0 auto;padding:.72rem 1.2rem;border:2px solid rgba(255,224,138,.58);border-radius:.8rem;background:linear-gradient(100deg,rgba(255,209,102,.18),rgba(8,40,41,.78));color:#eef7f7;cursor:pointer;text-align:left;transition:.2s;box-shadow:inset 0 1px 0 rgba(255,245,204,.12),0 0 22px rgba(255,209,102,.1)}
    .top-current-focus:hover{border-color:#ffe08a;box-shadow:0 0 18px rgba(255,209,102,.16)}
    .top-focus-kicker{flex:0 0 auto;color:#ffe08a;font:900 .78rem Orbitron,sans-serif;letter-spacing:.08em}
    .top-focus-copy{display:grid;grid-template-columns:minmax(0,1fr);gap:.14rem;min-width:0}
    .top-focus-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff7d8;font:900 1.25rem/1.05 'Exo 2',sans-serif;text-shadow:0 0 14px rgba(255,224,138,.18)}
    .top-focus-next{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c8d8d8;font-size:.92rem;font-weight:800}

    /* Keep these after the base header rules so the desktop segmented strip wins the cascade. */
    @media (min-width:1025px){
      #top-bar{grid-template-columns:minmax(220px,.72fr) minmax(480px,2fr) minmax(240px,.72fr);gap:0;min-height:64px;padding:0;background:rgba(0,36,36,.56);border:1px solid rgba(0,255,255,.3);border-radius:.75rem;box-shadow:0 0 18px rgba(0,255,255,.14);overflow:visible}
      #controls-row{display:contents}
      #controls-row>.streaks{grid-column:1;grid-row:1;display:flex;align-items:center;min-height:62px;padding:0 1.15rem;background:transparent;border:0;border-radius:0;box-shadow:none}
      #time-and-date-row{grid-column:3;min-height:62px;padding:0 1rem;background:transparent;border:0;border-left:1px solid rgba(255,224,138,.34);border-radius:0;box-shadow:none}
      .top-current-focus{grid-column:2;grid-row:1;width:auto;min-height:62px;margin:0;padding:.65rem 1.35rem;box-sizing:border-box;grid-template-columns:auto minmax(0,1fr);border:0;border-left:1px solid rgba(255,224,138,.48);border-right:1px solid rgba(255,224,138,.48);border-radius:0;background:linear-gradient(90deg,rgba(255,209,102,.13),rgba(255,209,102,.2),rgba(255,209,102,.1));box-shadow:inset 0 1px 0 rgba(255,245,204,.1),inset 0 -1px 0 rgba(255,209,102,.08)}
      .top-focus-copy{display:flex;align-items:center;gap:.65rem;min-width:0}
      .top-focus-title{flex:0 1 auto;max-width:55%}
      .top-focus-next{flex:1 1 auto}
    }

    /* Kanban + Side Panel */
    #kanban-container{grid-column:1;grid-row:2;display:flex;flex:1;gap:1.5rem;overflow-x:auto;align-items:stretch;position:relative}
    .kanban-column{flex:1 1 0;min-width:0;max-width:none;display:flex;flex-direction:column;background:linear-gradient(145deg,rgba(4,38,39,.94),rgba(1,24,27,.97));border:1px solid rgba(112,225,239,.22);border-radius:.75rem;overflow:hidden;padding:1rem .5rem;position:relative;z-index:2;transition:.2s;box-shadow:inset 0 1px 0 rgba(180,255,250,.08),0 8px 24px rgba(0,0,0,.22)}
    #kanban-backlog{--status-accent:#d0d3d6;background:linear-gradient(145deg,rgba(105,110,116,.13),rgba(12,14,16,.16));border-color:#74787d}
    #kanban-in-progress{--status-accent:#70dcff;background:linear-gradient(145deg,rgba(24,103,139,.14),rgba(5,28,40,.17));border-color:#288bb0}
    #kanban-done{--status-accent:#83dfb4;background:linear-gradient(145deg,rgba(37,111,82,.14),rgba(6,34,24,.17));border-color:#347e60}
    .kanban-column:hover{box-shadow:0 0 20px color-mix(in srgb,var(--status-accent,#70dcff) 32%,transparent)}
    .kanban-column h2{display:flex;align-items:center;justify-content:center;gap:.75rem;min-height:68px;box-sizing:border-box;font-family:'Exo 2',Roboto,sans-serif;font-weight:900;text-align:center;text-transform:uppercase;font-size:1.65rem;letter-spacing:.015em;line-height:1.05;padding:.95rem .5rem;margin:0 0 1rem;border:2px solid color-mix(in srgb,var(--status-accent,#70dcff) 52%,transparent);border-radius:7px;color:var(--status-accent,#70dcff);background:color-mix(in srgb,var(--status-accent,#70dcff) 13%,#071315);text-shadow:0 1px 0 #000;opacity:1}
    .kanban-column h2::after{content:attr(data-count);display:grid;place-items:center;min-width:1.75rem;height:1.75rem;padding:0 .25rem;border-radius:999px;background:color-mix(in srgb,var(--status-accent,#70dcff) 22%,#071315);border:2px solid color-mix(in srgb,var(--status-accent,#70dcff) 62%,transparent);color:var(--status-accent,#70dcff);font-size:.9rem;font-weight:900;line-height:1;text-shadow:none}
    .task-list{flex-grow:1;overflow-y:auto;display:flex;flex-direction:column;gap:.75rem;padding:0 .5rem}

    /* SIDE WIDGET (Clock + Countdowns) */
    #left-info{grid-column:2;grid-row:2;min-width:320px;display:flex;flex-direction:column;gap:1rem;background:var(--panel-bg);border:var(--panel-border);border-radius:.75rem;padding:1rem;position:relative;z-index:2}
    #left-info .section-title{font-family:'Exo 2',Roboto,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0;color:var(--accent-color);text-shadow:0 0 6px var(--glow-color);opacity:.9;border-bottom:1px solid rgba(0,255,255,.3);padding-bottom:.5rem}

    /* Big funky clock */
    .mega-clock{font-family:'Orbitron', system-ui, Arial, sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-width:0;background:linear-gradient(180deg, rgba(0,255,255,.08), rgba(0,255,255,.02));border:var(--panel-border);border-radius:.75rem;padding:1rem .65rem 1.25rem;box-shadow:0 0 20px rgba(0,255,255,.25) inset, 0 0 25px rgba(0,255,255,.15);position:relative;overflow:hidden}
    .time{width:100%;font-size:clamp(2.35rem,2.65vw,3.15rem);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.015em;text-align:center;white-space:nowrap;color:var(--accent-color);text-shadow:0 0 10px var(--glow-color), 0 0 20px rgba(0,255,255,.4);animation:pulse 2.2s ease-in-out infinite}
    .date{margin-top:.4rem;font-size:1rem;opacity:.9;color:var(--accent-color);text-shadow:0 0 6px var(--glow-color)}
    @keyframes pulse{0%,100%{transform:translateZ(0) scale(1)}50%{transform:translateZ(0) scale(1.02)}}

    /* Countdowns */
    .countdowns{display:flex;flex-direction:column;gap:.6rem}
    .countdowns-header{display:flex;align-items:center;gap:.5rem;justify-content:space-between}
    .countdowns-header h2{font-family:'Exo 2',Roboto,sans-serif;font-size:1.1rem;color:var(--accent-color);text-shadow:0 1px 0 #000;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0}
    .icon-btn{display:inline-grid;place-items:center;height:30px;width:30px;border-radius:.6rem;background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.35);color:var(--accent-color);cursor:pointer}
    .icon-btn:hover{background:rgba(0,255,255,.18)}
    .countdown-item{display:flex;justify-content:space-between;align-items:center;background:rgba(0,51,51,.5);padding:.5rem 1rem;border-radius:.5rem;border:var(--panel-border);color:var(--neon);min-width:260px;font-weight:700}
    .countdown-item button{background:transparent;border:none;color:var(--accent-color);cursor:pointer;opacity:.6}
    .countdown-item button:hover{opacity:1}
    .mini-form{display:flex;gap:.4rem;align-items:center;background:var(--panel-bg);border:var(--panel-border);border-radius:.6rem;padding:.5rem;box-shadow:var(--panel-shadow)}
    .mini-form input{background:rgba(0,51,51,.5);border:1px solid rgba(0,255,255,.2);color:var(--font-color);padding:.4rem;border-radius:.4rem}
    .hidden{display:none}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:9999;opacity:0;visibility:hidden;transition:.25s}
    .modal-overlay.open{opacity:1;visibility:visible}
    .modal{background:var(--subtle-color);border:var(--panel-border);box-shadow:var(--panel-shadow);border-radius:1rem;padding:2rem;width:90%;max-width:600px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:1rem;color:var(--font-color)}
    .modal h2{font-weight:300;margin:0;text-align:center;color:var(--accent-color);text-shadow:0 0 5px var(--glow-color)}
    .modal-field{display:flex;flex-direction:column}
    .modal-field label{font-size:.9rem;color:rgba(255,255,255,.6);margin-bottom:.5rem}
    .modal input,.modal textarea,.modal select{background:rgba(0,255,255,.05);border:1px solid rgba(0,255,255,.2);color:var(--font-color);padding:.75rem;border-radius:.5rem}
    .modal-buttons{display:flex;gap:1rem}
    .modal-button{flex:1;padding:.75rem;border-radius:.5rem;border:none;cursor:pointer;color:var(--font-color)}
    .modal-button.save{background:var(--accent-color);color:var(--bg-color)}
    .modal-button.delete{background:#e74c3c}
    .modal-button.close{background:#7f8c8d}

    /* Scrollbars */
    ::-webkit-scrollbar{width:12px;height:12px}
    ::-webkit-scrollbar-track{background:rgba(0,255,255,.05);border-radius:6px}
    ::-webkit-scrollbar-thumb{background:rgba(0,255,255,.4);border-radius:6px;border:3px solid rgba(0,255,255,.1);box-shadow:0 0 5px rgba(0,255,255,.5)}
    ::-webkit-scrollbar-thumb:hover{background:rgba(0,255,255,.6);box-shadow:0 0 10px rgba(0,255,255,.8)}

    /* Streaks */
    .streak-buttons{display:flex;gap:1rem}
    .streak-button{background:none;border:none;font-size:.9rem;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:.5rem;color:var(--accent-color)}
    .streak-button:hover{box-shadow:0 0 15px var(--glow-color);background:rgba(0,255,255,.1)}
    .streak-button i{font-size:1.2rem;color:var(--accent-color);text-shadow:0 0 5px var(--glow-color)}
    .streak-number{color:var(--accent-color);text-shadow:0 0 5px var(--glow-color);font-weight:700;font-size:1.2rem}

    @media (max-width:1024px){
      html,body{height:auto;font-size:16px;min-height:100%;overflow-x:hidden;overflow-y:auto}
      body{display:block}
      #dashboard{display:flex;flex-direction:column;width:100%;height:auto!important;min-height:calc(100vh - 54px);padding:1rem;gap:1rem;overflow:visible}
      #kanban-container{grid-column:auto;grid-row:auto;display:flex;flex-direction:column;overflow:visible;gap:1rem}
      .kanban-column{flex:none;width:100%;min-width:0;max-width:none;min-height:150px;overflow:visible;box-sizing:border-box}
      .task-list{overflow:visible;max-height:none;min-height:70px}
      #left-info{grid-column:auto;grid-row:auto;flex:none;width:100%;box-sizing:border-box;order:0}
    }
    @media (max-width:768px){
      #dashboard{display:flex;flex-direction:column;min-height:0!important;padding:.65rem;gap:.65rem}
      #mobile-overview{display:flex!important;flex-direction:column!important;width:100%;height:auto;min-height:0;overflow:hidden;padding:.55rem;background:rgba(0,40,40,.48);border:var(--panel-border);border-radius:.7rem;box-shadow:0 0 18px rgba(0,255,255,.14)}
      #kanban-container{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:.65rem}
      .focus-panel{grid-column:1/-1;display:grid;grid-template-columns:1fr;gap:.7rem;min-height:0;padding:.8rem .85rem;order:5;border-radius:.65rem}
      .focus-title{font-size:1.25rem;margin:.35rem 0 .2rem}
      .focus-detail{font-size:.75rem}
      .focus-progress{min-width:0}
      .focus-action{min-height:38px;padding:0 12px;font-size:.78rem}
      .focus-eyebrow-row,.focus-session,.focus-steps,.focus-note,.focus-actions,.focus-next-label,#focus-next{display:none!important}
      .focus-links{display:contents!important}
      .focus-change{display:none!important}
      #top-bar,#left-info{display:contents}
      #time-and-date-row{order:4;display:flex;flex-direction:row;align-items:center;width:100%;padding-top:.45rem;border-top:1px solid rgba(0,255,255,.14)}
      #app-title{display:none}
      .controls{width:100%;justify-content:center}
      .add-task-btn{width:100%;min-height:36px;padding:.42rem .3rem;font-size:.78rem;border-radius:.55rem}
      .top-current-focus{display:none!important}
      #controls-row{order:2;margin:0;padding:.4rem 0;justify-content:center;border-top:1px solid rgba(0,255,255,.1);border-bottom:1px solid rgba(0,255,255,.1)}
      .streak-buttons{justify-content:center;gap:.12rem}
      .streak-button{min-height:30px;padding:.25rem .3rem;gap:.25rem;font-size:.7rem}
      .streak-button i{font-size:.78rem}
      .streak-number{font-size:.82rem}
      #left-info .section-title{display:none}
      .mega-clock{order:1;width:100%;padding:.42rem .15rem;border-radius:.5rem}
      .time{font-size:clamp(1.35rem,7vw,1.9rem)}
      .date{font-size:clamp(.58rem,2.8vw,.78rem);white-space:nowrap}
      .countdowns{order:3;width:100%;min-width:0;justify-content:center;gap:.2rem;padding:.3rem 0}
      .countdowns-header h2{font-size:.72rem}
      .countdowns-header .icon-btn{width:24px;height:24px;font-size:.65rem}
      #countdown-list{max-height:28px;overflow-y:auto}
      .countdown-item{min-width:0;padding:.25rem .35rem;font-size:.62rem;border-radius:.35rem}
      .kanban-column{width:auto;min-height:0;aspect-ratio:1/1;padding:.45rem;cursor:pointer;overflow:hidden;background:linear-gradient(145deg,rgba(4,38,39,.94),rgba(1,24,27,.97));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(180,255,250,.08),0 8px 24px rgba(0,0,0,.28);transition:opacity .18s ease,visibility .18s ease,box-shadow .28s ease}
      #kanban-backlog{--status-accent:#d0d3d6;background:linear-gradient(145deg,#303236,#191b1e)!important;border-color:#74787d!important}
      #kanban-in-progress{--status-accent:#70dcff;background:linear-gradient(145deg,#123d52,#0a2634)!important;border-color:#288bb0!important}
      #kanban-done{--status-accent:#83dfb4;background:linear-gradient(145deg,#1d4838,#0d2a21)!important;border-color:#347e60!important}
      #kanban-backlog h2{background:#3a3d41!important}
      #kanban-in-progress h2{background:#10445c!important}
      #kanban-done h2{background:#20503e!important}
      #kanban-container .kanban-column h2{position:relative;top:0!important;z-index:4;display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:42px;box-sizing:border-box;font-family:'Exo 2',Roboto,sans-serif;font-weight:900;letter-spacing:.01em;background:color-mix(in srgb,var(--status-accent) 13%,#071315);border:2px solid color-mix(in srgb,var(--status-accent) 52%,transparent);border-radius:6px;padding:.55rem .2rem;margin-bottom:.45rem;font-size:clamp(.82rem,3.7vw,1.05rem);line-height:1.05;white-space:nowrap;cursor:pointer;color:var(--status-accent);text-shadow:0 1px 0 #000}
      .kanban-column h2::after{content:attr(data-count);display:grid;place-items:center;min-width:1.4rem;height:1.4rem;padding:0 .18rem;border-radius:999px;background:color-mix(in srgb,var(--status-accent) 22%,#071315);border:1px solid color-mix(in srgb,var(--status-accent) 62%,transparent);color:var(--status-accent);font-size:.74rem;font-weight:900;line-height:1;text-shadow:none}
      .kanban-column .task-list{display:flex;min-height:0;overflow-y:auto;padding:0 .15rem .25rem;gap:.35rem;pointer-events:auto}
      .kanban-column .task-card{min-height:0;padding:.48rem .52rem;opacity:.92;transform:none;background:rgba(0,0,0,.14);border-color:color-mix(in srgb,var(--status-accent) 28%,transparent);color:var(--status-accent);touch-action:none;user-select:none;-webkit-user-select:none}
      .kanban-column .task-card h3{font-size:.76rem;line-height:1.2;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .kanban-column .subtask-count{font-size:.62rem;margin-top:.18rem}
      .kanban-column:not(.is-expanded) .card-nav{display:none}
      .touch-drag-ghost{position:fixed!important;z-index:10050!important;margin:0!important;pointer-events:none!important;opacity:.92!important;transform:scale(1.04) rotate(1deg)!important;background:#102b30!important;box-shadow:0 14px 38px rgba(0,0,0,.55),0 0 22px rgba(0,255,255,.35)!important}
      .kanban-column.touch-drop-target{outline:2px solid var(--status-accent);outline-offset:-3px;box-shadow:0 0 28px color-mix(in srgb,var(--status-accent) 42%,transparent)!important}
      #kanban-container.has-expanded .kanban-column:not(.is-expanded){opacity:0;visibility:hidden}
      .kanban-column.is-expanded{position:absolute;inset:0;z-index:30;width:100%;height:100%;aspect-ratio:auto;min-height:0;cursor:default;background-color:#031d20!important;background-image:repeating-linear-gradient(100deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 5px),linear-gradient(145deg,#073032 0%,#031d20 55%,#021518 100%)!important;border:1px solid rgba(74,255,244,.52);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 34px rgba(0,255,255,.42),inset 0 1px 0 rgba(190,255,250,.16),inset 0 0 42px rgba(0,255,255,.055);animation:kanban-focus-in .22s ease-out}
      @keyframes kanban-focus-in{from{opacity:.4;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
      .kanban-column.is-expanded h2{font-size:1.15rem;padding:.72rem}
      .kanban-column.is-expanded h2::before{content:'Tap to collapse';position:absolute;left:.6rem;font-family:Rajdhani,sans-serif;font-size:.58rem;letter-spacing:0;text-transform:none;opacity:.55;text-shadow:none}
      .kanban-column.is-expanded .task-list{display:flex;overflow-y:auto;pointer-events:auto;padding:0 .35rem .45rem}
      .kanban-column.is-expanded .task-card{min-height:64px;padding:1.85rem .85rem .8rem;opacity:1;transform:none}
      .kanban-column.is-expanded .task-card h3{font-size:1rem;white-space:normal}
      .kanban-column.is-expanded .subtask-count{font-size:.9rem}
      .task-card{min-height:64px;padding:1.85rem .85rem .8rem;touch-action:manipulation}
      .card-nav button{width:32px;height:30px}
      .modal{width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow-y:auto;padding:1rem}
    }

    /* Authentication and cloud-sync status */
    #auth-overlay{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:rgba(0,0,0,.92);backdrop-filter:blur(10px)}
    #auth-overlay.hidden{display:none}
    .auth-card{width:min(420px,calc(100vw - 40px));box-sizing:border-box;padding:2rem;text-align:center;background:rgba(0,51,51,.72);border:1px solid rgba(0,255,255,.35);border-radius:16px;box-shadow:0 0 35px rgba(0,255,255,.18)}
    .auth-card h2{margin:.5rem 0;color:var(--accent-color);font-family:Orbitron,sans-serif;letter-spacing:.16em}
    .auth-card p{line-height:1.5;color:var(--font-color);opacity:.86}
    .auth-icon{font-size:2rem;color:var(--accent-color)}
    #google-sign-in,#legacy-import,#sign-out{border:1px solid rgba(0,255,255,.45);background:rgba(0,255,255,.12);color:var(--font-color);border-radius:8px;padding:.65rem .9rem;cursor:pointer}
    #google-sign-in{margin-top:.8rem;font-size:1rem}
    #google-sign-in:hover,#legacy-import:hover,#sign-out:hover{background:rgba(0,255,255,.22)}
    #google-sign-in:disabled,#legacy-import:disabled{opacity:.55;cursor:wait}
    #auth-error{min-height:1.2rem;margin-top:.8rem;color:#ff8b8b;font-size:.85rem}
    #user-bar{position:relative;z-index:20;display:none;font-size:.9rem}
    #user-bar.visible{display:block}
    #user-bar summary{display:flex;align-items:center;gap:.45rem;min-height:38px;padding:0 .75rem;border:1px solid rgba(0,255,255,.42);border-radius:8px;background:rgba(0,255,255,.09);color:#7fffd4;cursor:pointer;list-style:none;white-space:nowrap}
    #user-bar summary::-webkit-details-marker{display:none}
    #user-bar summary:hover{background:rgba(0,255,255,.18)}
    #user-bar[open] summary{border-color:rgba(0,255,255,.7)}
    .sync-menu{position:absolute;right:0;top:calc(100% + 8px);display:grid;gap:.55rem;min-width:220px;padding:.75rem;background:rgba(0,18,18,.98);border:1px solid rgba(0,255,255,.32);border-radius:8px;box-shadow:0 12px 28px rgba(0,0,0,.55)}
