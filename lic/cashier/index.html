<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Cashier · Invincible LIC</title><meta name="theme-color" content="#071820">
  <script src="theme.js"></script>
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="stylesheet" href="../../site-nav.css?v=18"><link rel="stylesheet" href="cashier.css?v=20261103-screen">
</head>
<body class="cashier-page">
  <nav class="global-nav" aria-label="Primary navigation"><a class="nav-brand" href="/invincible/">INVINCIBLE</a></nav>
  <main class="cashier">
    <header class="page-heading"><a class="back" href="../" aria-label="Back to LIC">←</a><h1>Cashier</h1><button id="openMenu" aria-label="Cashier menu" title="Menu">⋯</button></header>
    <p id="status" role="status" aria-live="polite">Loading…</p><p id="error" class="error" role="alert"></p><button id="retryCounter" hidden>Retry</button>
    <section id="workspace" hidden aria-label="Cash counter">
      <section id="entryPanel" hidden aria-label="Amount to collect"><label for="amountInput">Amount ₹</label><input id="amountInput" class="amount-input" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off"><button id="addAmount" aria-label="Multiple amounts and reference">+</button><strong id="due" class="sr-only">₹0</strong></section>
      <section id="cashPanel" hidden aria-label="Count cash">
        <div class="mode-tabs" role="group" aria-label="Cash direction"><button id="receivedMode" aria-pressed="true">Cash received</button><button id="returnedMode" aria-pressed="false">Change given</button></div>
        <div id="denominations" class="denominations"></div>
        <div class="loose-row"><button id="openCoins">Coins <span id="coinTotal">₹0</span></button><label for="loose">Misc ₹</label><input id="loose" inputmode="decimal" type="text" value="0" autocomplete="off" enterkeyhint="done"><strong id="cashTotal" class="sr-only">₹0</strong></div>
      </section>
      <div id="runningSummary" class="running-summary" aria-live="polite" hidden></div>
      <div id="footerActions" class="counter-actions" hidden><div id="saveState" class="save-state" role="status"></div><div class="action-buttons"><button id="nextTransaction" class="primary">Next Transaction</button><button id="closeCounter">Close Counter</button></div></div>
      <section id="closingSummary" hidden></section>
    </section>
  </main>
  <dialog id="menuDialog" aria-labelledby="menuTitle"><header><h2 id="menuTitle">Cashier</h2><button data-close="menuDialog" aria-label="Close menu">×</button></header><div id="counterLabel"></div><label>Counter history<select id="counterPicker" aria-label="Counter history"><option value="">New counter</option></select></label><button id="openLog">Transaction log</button><div class="theme-switch" role="group" aria-label="Colour theme"><button data-theme-choice="light" aria-pressed="false">Light</button><button data-theme-choice="dark" aria-pressed="true">Dark</button></div><a href="../">LIC workspace</a><a href="../../">Dashboard</a></dialog>
  <dialog id="amountDialog" aria-labelledby="amountTitle"><header><h2 id="amountTitle">Amounts</h2><button data-close="amountDialog" aria-label="Close amounts">×</button></header><div id="amounts"></div><p id="amountError" class="error" role="alert"></p><button id="addAmountLine">+ Add amount</button><button id="doneAmounts" class="primary">Done</button></dialog>
  <dialog id="coinDialog" aria-labelledby="coinTitle"><header><h2 id="coinTitle">Coins</h2><button data-close="coinDialog" aria-label="Close coins">×</button></header><div id="coinDenominations"></div><button data-close="coinDialog" class="primary">Done</button></dialog>
  <dialog id="logDialog" aria-labelledby="logTitle"><header><h2 id="logTitle">Transaction log</h2><button data-close="logDialog" aria-label="Close log">×</button></header><section id="logPanel"><span id="logCount"></span><p id="logStatus"></p><div id="log"></div></section></dialog>
  <dialog id="closeDialog" aria-labelledby="closeTitle"><h2 id="closeTitle">Close the counter?</h2><p id="closeError" class="error" role="alert"></p><div class="dialog-actions"><button id="cancelClose" autofocus>Cancel</button><button id="confirmClose" class="primary">Close Counter</button></div></dialog>
  <script type="module" src="../../site-nav.js?v=7"></script><script type="module" src="cashier.js?v=20261103-screen"></script>
</body></html>
