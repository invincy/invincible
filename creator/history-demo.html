<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>British India · Map engine demo</title><link rel="stylesheet" href="history-workspace.css"><style>body{margin:0;background:#0c1720;color:#dbe6ee;font-family:system-ui}main{max-width:1300px;margin:auto}header{padding:16px 26px;color:#ceac72;font-size:13px}.history-workspace{max-height:none}button,a{touch-action:manipulation}</style></head><body><main><header>INVINCIBLE / CREATOR STUDIO · Unsaved local demonstration · No account or paid AI needed</header><nav style="padding:0 26px"><button id="maps">Animated Maps</button> <button id="clips">Production Clips</button></nav><div id="demo"></div></main><script type="module">
import {britishIndiaDemo} from './history-demo.js';
import {mountHistoryWorkspace} from './history-workspace.js';
const project=britishIndiaDemo(),root=document.querySelector('#demo');let view,area='Maps';
function render(){view?.destroy();view=mountHistoryWorkspace(root,{getProject:()=>project,onChange:()=>{},onRefresh:render,area,copyText:text=>navigator.clipboard.writeText(text)});}
document.querySelector('#maps').onclick=()=>{area='Maps';render();};document.querySelector('#clips').onclick=()=>{area='Clips';render();};
render();
</script></body></html>
