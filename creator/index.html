<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/invincible/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/invincible/assets/branding/invincible-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/invincible/assets/branding/invincible-180.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Creator Studio · Invincible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site-nav.css?v=17">
  <link rel="stylesheet" href="creator.css?v=8">
  <link rel="stylesheet" href="production-workbench.css?v=12">
</head>
<body class="creator-page">
  <nav class="global-nav" data-compact-nav data-icon-nav aria-label="Primary navigation"><a class="nav-brand" href="/invincible/">INVINCIBLE</a></nav>
  <script type="module" src="../site-nav.js?v=8"></script>

  <header class="studio-header">
    <div><h1>Creator Studio</h1></div>
    <div class="header-actions"><button id="testProject" class="secondary">Demo</button><button id="addContent" class="primary">+ New</button></div>
  </header>
  <div id="status" class="sync-status" role="status" aria-live="polite">Connecting to Firebase…</div>

  <main id="app" hidden>
    <section class="metrics" aria-label="Content overview">
      <button class="metric-card" type="button" data-metric="pipeline"><span>In pipeline</span><strong id="inPipeline">0</strong></button>
      <button class="metric-card" type="button" data-metric="record"><span>Ready to record</span><strong id="readyCount">0</strong></button>
      <button class="metric-card" type="button" data-metric="next"><span>Next release</span><strong id="nextRelease">—</strong><small id="nextReleaseTitle">nothing scheduled</small></button>
      <button class="metric-card momentum" type="button" data-metric="published"><span>Published</span><strong id="publishedCount">0</strong></button>
    </section>
    <div id="metricView" class="metric-view" hidden><span id="metricViewLabel"></span><button id="clearMetric" type="button">Show everything ×</button></div>

    <section class="toolbar">
      <div class="filter-group" aria-label="Filter content">
        <button class="filter active" data-filter="All">All</button>
        <button class="filter" data-filter="Short">Shorts</button>
        <button class="filter" data-filter="Long">Long-form</button>
      </div>
      <label class="search"><span>Search</span><input id="searchInput" type="search" placeholder="Title, hook or series"></label>
    </section>

    <nav id="stageTabs" class="stage-tabs" aria-label="Workflow stage"></nav>
    <section id="board" class="board" aria-label="Content workflow"></section>
  </main>

  <dialog id="contentDialog">
    <form id="contentForm">
      <div class="dialog-title"><div><h2 id="dialogHeading">New project</h2></div><button type="button" class="icon close" aria-label="Close">×</button></div>
      <label class="content-title-field">Title<input name="title" maxlength="120" required placeholder="Gaganyaan — India's human spaceflight mission"></label>
      
      <section id="contentStoryboard" aria-label="Project production workbench"></section>
      <details id="contentDetails" class="content-project-details">
        <summary>Details</summary>
        <div class="two"><label>Format<select name="format"><option>Short</option><option>Long</option></select></label><label>Workflow stage<select name="stage" id="stageSelect"></select></label></div>
        <div class="two"><label>Series<select name="series"><option>Concepts, Clearly</option><option>Plan Decoder</option><option>Real-Life Scenarios</option><option>General</option></select></label><label>Publish date<input name="publishDate" type="date"></label></div>
        <input type="hidden" name="hook"><input type="hidden" name="script"><input type="hidden" name="notes">
      </details>
      <p id="contentSaveError" role="alert"></p>
      <div class="dialog-actions"><button id="deleteContent" type="button" class="danger">Delete</button><span id="contentShotSummary" role="status" aria-live="polite">No scenes</span><button type="button" class="secondary close">Cancel</button><button id="saveContent" class="primary">Create</button></div>
    </form>
  </dialog>
  <script type="module" src="creator.js?v=23"></script>
</body>
</html>
