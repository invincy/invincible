    <div id="root"></div>
    <script>
    /* iPad/Pencil guard: a palm is reported as touch, while Pencil is `pen`. */
    (function journalInputGuard() {
      const isDrawingCanvas = (target) => target && target.id === "live-canvas";
      const isPalmPointer = (event) => isDrawingCanvas(event.target) && event.pointerType === "touch";
      let pencilActive = false;
      let pencilGraceUntil = 0;
      let fingerScroll = null;

      ["pointerdown", "pointermove", "pointerup", "pointercancel"].forEach((type) => {
        document.addEventListener(type, function (event) {
          if (isDrawingCanvas(event.target) && event.pointerType === "pen") {
            pencilActive = type !== "pointerup" && type !== "pointercancel";
            pencilGraceUntil = performance.now() + 250;
            return;
          }
          if (!isPalmPointer(event)) return;
          const palmBlocked = pencilActive || performance.now() < pencilGraceUntil;
          event.preventDefault();
          if (!palmBlocked && type === "pointerdown" && !fingerScroll) {
            const scroller = document.querySelector(".journal-page .app-container");
            if (scroller) fingerScroll = { id: event.pointerId, y: event.clientY, top: scroller.scrollTop, scroller: scroller };
          } else if (!palmBlocked && type === "pointermove" && fingerScroll && fingerScroll.id === event.pointerId) {
            fingerScroll.scroller.scrollTop = fingerScroll.top + fingerScroll.y - event.clientY;
          }
          if ((type === "pointerup" || type === "pointercancel") && fingerScroll && fingerScroll.id === event.pointerId) fingerScroll = null;
          event.stopImmediatePropagation();
        }, { capture: true, passive: false });
      });

      document.addEventListener("contextmenu", function (event) {
        if (event.target.closest(".canvas-container, .toolbar")) event.preventDefault();
      }, { capture: true });

      document.addEventListener("selectstart", function (event) {
        if (event.target.closest(".journal-page") && !event.target.closest("input, textarea")) {
          event.preventDefault();
        }
      }, { capture: true });

      document.addEventListener("dragstart", function (event) {
        if (event.target.closest(".journal-page") && !event.target.closest("input, textarea")) {
          event.preventDefault();
        }
      }, { capture: true });

      const upgradeTools = () => {
        const toolbar = document.querySelector(".toolbar");
        const canvas = document.getElementById("live-canvas");
        if (!toolbar || !canvas) return false;

        canvas.setAttribute("aria-label", "Journal drawing canvas. Apple Pencil, stylus, or mouse input only.");
        canvas.setAttribute("draggable", "false");
        toolbar.setAttribute("aria-label", "Drawing tools");

        toolbar.querySelectorAll(".icon-btn").forEach((tool) => {
          const label = tool.getAttribute("title") || "Drawing tool";
          tool.setAttribute("role", "button");
          tool.setAttribute("tabindex", "0");
          tool.setAttribute("aria-label", label);
          tool.dataset.toolLabel = label;
          tool.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              tool.click();
            }
          });
        });

        if (!toolbar.querySelector(".pencil-ready")) {
          const status = document.createElement("div");
          status.className = "pencil-ready";
          status.innerHTML = '<span aria-hidden="true">✦</span><strong>Pencil ready</strong><small> Palm rejection on</small>';
          toolbar.appendChild(status);
        }
        return true;
      };

      const observer = new MutationObserver(() => {
        if (upgradeTools()) observer.disconnect();
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener("load", upgradeTools, { once: true });
    })();

    document.addEventListener("click", function (event) {
      const button = event.target.closest("button");
      if (button && button.textContent.trim() === "Monthly Finance") {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.href = "/invincible/journal/finance.html";
      }
    }, true);
  </script>
