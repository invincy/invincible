<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invincible</title>

  <!-- Favicon (inline SVG, no file needed) -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%23003333"/><path d="M12 48 L24 16 L32 36 L40 16 L52 48" stroke="%2300ffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' />
  <meta name="theme-color" content="#003333"/>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <!-- Futuristic clock font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --neon:#00ffff;
      --bg-color:#000;
      --accent-color:#00ffff;
      --subtle-color:#003333;
      --font-color:#e0e6ec;
      --glow-color:#00ffff;
      --panel-bg:rgba(0,51,51,.3);
      --panel-border:1px solid rgba(0,255,255,.2);
      --panel-shadow:0 0 15px rgba(0,255,255,.2);
    }

    html,body{height:100%;margin:0;overflow:hidden;font-family:Roboto,system-ui,Arial,sans-serif;font-size:17px;font-weight:500;color:var(--font-color);background:var(--bg-color)}
    body{display:flex;flex-direction:column;position:relative}

    /* Particles */
    #particles-js{position:absolute;inset:0;z-index:1;opacity:.5}

    /* Cards */
    .task-card{position:relative;padding:1.2rem 1rem .9rem; padding-top:2rem; overflow:visible; background:transparent; border:var(--panel-border); border-radius:.5rem; color:var(--accent-color); transition:.15s}
    .task-card:hover{transform:translateY(-2px);border-color:var(--accent-color);box-shadow:0 0 10px rgba(0,255,255,.3)}
    .task-card h3{margin:0 0 .4rem;font-family:Orbitron,Roboto,sans-serif;font-size:1.12rem;font-weight:700;line-height:1.38;letter-spacing:.01em;color:var(--accent-color);text-shadow:0 1px 0 #000}
    .task-card .subtask-count{font-size:1rem;font-weight:600;line-height:1.4;opacity:1;color:var(--accent-color)}
    .task-card.dragging{opacity:.5;transform:scale(.98)}

    .task-card.is-focus-task{border-color:var(--status-accent,#ffe08a);background:linear-gradient(145deg,rgba(255,224,138,.12),rgba(0,0,0,.08));box-shadow:0 0 22px color-mix(in srgb,var(--status-accent,#ffe08a) 28%,transparent)}
    .task-card.is-focus-task:before{content:"NEXT";position:absolute;left:10px;top:7px;padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--status-accent,#ffe08a) 18%,transparent);border:1px solid color-mix(in srgb,var(--status-accent,#ffe08a) 45%,transparent);color:var(--status-accent,#ffe08a);font:700 9px Orbitron,sans-serif;letter-spacing:.1em}
    .focus-panel{display:grid;grid-template-columns:1fr;gap:.75rem;align-items:center;min-height:0;padding:1rem;border:1px solid rgba(255,209,102,.48);border-radius:.75rem;background:radial-gradient(circle at 88% 18%,rgba(255,209,102,.18),transparent 13rem),linear-gradient(145deg,rgba(58,43,13,.96),rgba(7,27,30,.94));box-shadow:0 0 34px rgba(255,184,38,.16),inset 0 1px 0 rgba(255,245,204,.16);position:relative;z-index:3;overflow:hidden}
    .focus-panel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#ffe08a,#70dcff);box-shadow:0 0 18px rgba(255,224,138,.55)}
    .focus-kicker{font:700 11px Orbitron,sans-serif;letter-spacing:.18em;color:#ffe08a;text-transform:uppercase}
    .focus-title{margin:.45rem 0 .35rem;font-size:1.5rem;line-height:1.12;color:#fff4cc;text-shadow:0 0 16px rgba(255,209,102,.22)}
    .focus-detail{margin:0;color:#d3e6e6;font-size:1rem;font-weight:600;line-height:1.5}
    .focus-progress{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-width:0}
    .focus-meter{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
    .focus-meter span{display:block;width:0;height:100%;background:linear-gradient(90deg,#ffe08a,#83dfb4);transition:width .25s}
    .focus-percent{font:700 1.35rem Orbitron,sans-serif;color:#83dfb4}
    .focus-action{grid-column:1/-1;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border:1px solid #ffe08a;border-radius:.75rem;background:#ffe08a;color:#151006;font-weight:800;text-decoration:none;box-shadow:0 12px 30px rgba(255,184,38,.18)}
    .focus-action:hover{transform:translateY(-1px);box-shadow:0 16px 38px rgba(255,184,38,.28)}

    /* Card arrows */
    .card-nav{position:absolute;top:6px;right:8px;display:flex;gap:6px;z-index:10}
    .card-nav button{display:inline-grid;place-items:center;height:22px;width:22px;background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.35);color:var(--accent-color);border-radius:6px;cursor:pointer;box-shadow:0 0 6px rgba(0,255,255,.25)}
    .card-nav button:hover{background:rgba(0,255,255,.18)}
    .card-nav button:disabled{opacity:.35;cursor:default}

    /* Layout */
    #dashboard{display:grid;grid-template-columns:clamp(320px,19vw,370px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);width:100vw;height:100vh;padding:1.25rem 1.5rem 1.5rem;box-sizing:border-box;gap:1.25rem;position:relative;z-index:2}
    #mobile-overview{display:contents}
    #top-bar{grid-column:1/-1;display:flex;flex-direction:column;padding:1rem 1.5rem;background:var(--panel-bg);border-radius:.75rem;border:var(--panel-border);box-shadow:var(--panel-shadow);z-index:10}
    #time-and-date-row{display:flex;justify-content:space-between;align-items:center}
    #controls-row{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;border-top:1px solid rgba(0,255,255,.2);margin-top:1rem}

    /* Title on the left */
    #app-title{font-size:1.3rem;letter-spacing:.12rem;text-transform:uppercase;color:var(--accent-color);text-shadow:0 0 6px var(--glow-color)}

    .controls{display:flex;align-items:center;gap:1rem}
    .add-task-btn{font-family:Orbitron,Roboto,sans-serif;font-weight:700;background:transparent;color:var(--accent-color);border:1px solid var(--accent-color);padding:.6rem .9rem;border-radius:.75rem;font-size:1rem;cursor:pointer;transition:.2s;text-shadow:0 0 5px var(--glow-color)}
    .add-task-btn:hover{background:rgba(0,255,255,.1);box-shadow:0 0 10px rgba(0,255,255,.5)}

    /* Kanban + Side Panel */
    #kanban-container{grid-column:2;display:flex;flex:1;gap:1.5rem;overflow-x:auto;align-items:stretch;position:relative}
    .kanban-column{flex:1 1 0;min-width:0;max-width:none;display:flex;flex-direction:column;background:linear-gradient(145deg,rgba(4,38,39,.94),rgba(1,24,27,.97));border:1px solid rgba(112,225,239,.22);border-radius:.75rem;overflow:hidden;padding:1rem .5rem;position:relative;z-index:2;transition:.2s;box-shadow:inset 0 1px 0 rgba(180,255,250,.08),0 8px 24px rgba(0,0,0,.22)}
    #kanban-backlog{--status-accent:#d0d3d6;background:linear-gradient(145deg,#303236,#191b1e);border-color:#74787d}
    #kanban-today{--status-accent:#ffe08a;background:linear-gradient(145deg,#604817,#30250e);border:2px solid #e9b949;box-shadow:inset 0 1px 0 rgba(255,245,204,.28),0 0 30px rgba(255,184,38,.28)}
    #kanban-in-progress{--status-accent:#70dcff;background:linear-gradient(145deg,#123d52,#0a2634);border-color:#288bb0}
    #kanban-done{--status-accent:#83dfb4;background:linear-gradient(145deg,#1d4838,#0d2a21);border-color:#347e60}
    .kanban-column:hover{box-shadow:0 0 20px color-mix(in srgb,var(--status-accent,#70dcff) 32%,transparent)}
    .kanban-column h2{display:flex;align-items:center;justify-content:center;gap:.65rem;min-height:54px;box-sizing:border-box;font-family:Orbitron,Roboto,sans-serif;font-weight:900;text-align:center;text-transform:uppercase;font-size:1.24rem;letter-spacing:.03em;line-height:1.1;padding:.75rem .45rem;margin:0 0 1rem;border:2px solid color-mix(in srgb,var(--status-accent,#70dcff) 52%,transparent);border-radius:7px;color:var(--status-accent,#70dcff);background:color-mix(in srgb,var(--status-accent,#70dcff) 13%,#071315);text-shadow:0 1px 0 #000;opacity:1}
    .kanban-column h2::after{content:attr(data-count);display:grid;place-items:center;min-width:1.75rem;height:1.75rem;padding:0 .25rem;border-radius:999px;background:color-mix(in srgb,var(--status-accent,#70dcff) 22%,#071315);border:2px solid color-mix(in srgb,var(--status-accent,#70dcff) 62%,transparent);color:var(--status-accent,#70dcff);font-size:.9rem;font-weight:900;line-height:1;text-shadow:none}
    .task-list{flex-grow:1;overflow-y:auto;display:flex;flex-direction:column;gap:.75rem;padding:0 .5rem}

    /* SIDE WIDGET (Clock + Countdowns) */
    #left-info{min-width:320px;display:flex;flex-direction:column;gap:1rem;background:var(--panel-bg);border:var(--panel-border);border-radius:.75rem;padding:1rem;position:relative;z-index:2}
    #left-info .section-title{font-family:Orbitron,Roboto,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0;color:var(--accent-color);text-shadow:0 0 6px var(--glow-color);opacity:.9;border-bottom:1px solid rgba(0,255,255,.3);padding-bottom:.5rem}

    /* Big funky clock */
    .mega-clock{font-family:'Orbitron', system-ui, Arial, sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-width:0;background:linear-gradient(180deg, rgba(0,255,255,.08), rgba(0,255,255,.02));border:var(--panel-border);border-radius:.75rem;padding:1rem .65rem 1.25rem;box-shadow:0 0 20px rgba(0,255,255,.25) inset, 0 0 25px rgba(0,255,255,.15);position:relative;overflow:hidden}
    .time{width:100%;font-size:clamp(2.35rem,2.65vw,3.15rem);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.015em;text-align:center;white-space:nowrap;color:var(--accent-color);text-shadow:0 0 10px var(--glow-color), 0 0 20px rgba(0,255,255,.4);animation:pulse 2.2s ease-in-out infinite}
    .date{margin-top:.4rem;font-size:1rem;opacity:.9;color:var(--accent-color);text-shadow:0 0 6px var(--glow-color)}
    @keyframes pulse{0%,100%{transform:translateZ(0) scale(1)}50%{transform:translateZ(0) scale(1.02)}}

    /* Countdowns */
    .countdowns{display:flex;flex-direction:column;gap:.6rem}
    .countdowns-header{display:flex;align-items:center;gap:.5rem;justify-content:space-between}
    .countdowns-header h2{font-family:Orbitron,Roboto,sans-serif;font-size:1.1rem;color:var(--accent-color);text-shadow:0 1px 0 #000;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0}
    .icon-btn{display:inline-grid;place-items:center;height:30px;width:30px;border-radius:.6rem;background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.35);color:var(--accent-color);cursor:pointer}
    .icon-btn:hover{background:rgba(0,255,255,.18)}
    .countdown-item{display:flex;justify-content:space-between;align-items:center;background:rgba(0,51,51,.5);padding:.5rem 1rem;border-radius:.5rem;border:var(--panel-border);color:var(--neon);min-width:260px;font-weight:700}
    .countdown-item button{background:transparent;border:none;color:var(--accent-color);cursor:pointer;opacity:.6}
    .countdown-item button:hover{opacity:1}
    .mini-form{display:flex;gap:.4rem;align-items:center;background:var(--panel-bg);border:var(--panel-border);border-radius:.6rem;padding:.5rem;box-shadow:var(--panel-shadow)}
    .mini-form input{background:rgba(0,51,51,.5);border:1px solid rgba(0,255,255,.2);color:var(--font-color);padding:.4rem;border-radius:.4rem}
    .hidden{display:none}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:9999;opacity:0;visibility:hidden;transition:.25s}
    .modal-overlay.open{opacity:1;visibility:visible}
    .modal{background:var(--subtle-color);border:var(--panel-border);box-shadow:var(--panel-shadow);border-radius:1rem;padding:2rem;width:90%;max-width:600px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:1rem;color:var(--font-color)}
    .modal h2{font-weight:300;margin:0;text-align:center;color:var(--accent-color);text-shadow:0 0 5px var(--glow-color)}
    .modal-field{display:flex;flex-direction:column}
    .modal-field label{font-size:.9rem;color:rgba(255,255,255,.6);margin-bottom:.5rem}
    .modal input,.modal textarea,.modal select{background:rgba(0,255,255,.05);border:1px solid rgba(0,255,255,.2);color:var(--font-color);padding:.75rem;border-radius:.5rem}
    .modal-buttons{display:flex;gap:1rem}
    .modal-button{flex:1;padding:.75rem;border-radius:.5rem;border:none;cursor:pointer;color:var(--font-color)}
    .modal-button.save{background:var(--accent-color);color:var(--bg-color)}
    .modal-button.delete{background:#e74c3c}
    .modal-button.close{background:#7f8c8d}

    /* Scrollbars */
    ::-webkit-scrollbar{width:12px;height:12px}
    ::-webkit-scrollbar-track{background:rgba(0,255,255,.05);border-radius:6px}
    ::-webkit-scrollbar-thumb{background:rgba(0,255,255,.4);border-radius:6px;border:3px solid rgba(0,255,255,.1);box-shadow:0 0 5px rgba(0,255,255,.5)}
    ::-webkit-scrollbar-thumb:hover{background:rgba(0,255,255,.6);box-shadow:0 0 10px rgba(0,255,255,.8)}

    /* Streaks */
    .streak-buttons{display:flex;gap:1rem}
    .streak-button{background:none;border:none;font-size:.9rem;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:.5rem;color:var(--accent-color)}
    .streak-button:hover{box-shadow:0 0 15px var(--glow-color);background:rgba(0,255,255,.1)}
    .streak-button i{font-size:1.2rem;color:var(--accent-color);text-shadow:0 0 5px var(--glow-color)}
    .streak-number{color:var(--accent-color);text-shadow:0 0 5px var(--glow-color);font-weight:700;font-size:1.2rem}

    @media (max-width:1024px){
      html,body{height:auto;font-size:16px;min-height:100%;overflow-x:hidden;overflow-y:auto}
      body{display:block}
      #dashboard{display:flex;flex-direction:column;width:100%;height:auto!important;min-height:calc(100vh - 54px);padding:1rem;gap:1rem;overflow:visible}
      #kanban-container{display:flex;flex-direction:column;overflow:visible;gap:1rem}
      .kanban-column{flex:none;width:100%;min-width:0;max-width:none;min-height:150px;overflow:visible;box-sizing:border-box}
      .task-list{overflow:visible;max-height:none;min-height:70px}
      #left-info{flex:none;width:100%;box-sizing:border-box;order:0}
    }
    @media (max-width:768px){
      #dashboard{display:flex;flex-direction:column;min-height:0!important;padding:.65rem;gap:.65rem}
      #mobile-overview{display:flex!important;flex-direction:column!important;width:100%;height:auto;min-height:0;overflow:hidden;padding:.55rem;background:rgba(0,40,40,.48);border:var(--panel-border);border-radius:.7rem;box-shadow:0 0 18px rgba(0,255,255,.14)}
      #kanban-container{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:.65rem}
      .focus-panel{grid-column:1/-1;display:grid;grid-template-columns:1fr;gap:.7rem;min-height:0;padding:.8rem .85rem;order:5;border-radius:.65rem}
      .focus-title{font-size:1.25rem;margin:.35rem 0 .2rem}
      .focus-detail{font-size:.75rem}
      .focus-progress{min-width:0}
      .focus-action{min-height:38px;padding:0 12px;font-size:.78rem}
      #top-bar,#left-info{display:contents}
      #time-and-date-row{order:4;display:flex;flex-direction:row;align-items:center;width:100%;padding-top:.45rem;border-top:1px solid rgba(0,255,255,.14)}
      #app-title{display:none}
      .controls{width:100%;justify-content:center}
      .add-task-btn{width:100%;min-height:36px;padding:.42rem .3rem;font-size:.78rem;border-radius:.55rem}
      #controls-row{order:2;margin:0;padding:.4rem 0;justify-content:center;border-top:1px solid rgba(0,255,255,.1);border-bottom:1px solid rgba(0,255,255,.1)}
      .streak-buttons{justify-content:center;gap:.12rem}
      .streak-button{min-height:30px;padding:.25rem .3rem;gap:.25rem;font-size:.7rem}
      .streak-button i{font-size:.78rem}
      .streak-number{font-size:.82rem}
      #left-info .section-title{display:none}
      .mega-clock{order:1;width:100%;padding:.42rem .15rem;border-radius:.5rem}
      .time{font-size:clamp(1.35rem,7vw,1.9rem)}
      .date{font-size:clamp(.58rem,2.8vw,.78rem);white-space:nowrap}
      .countdowns{order:3;width:100%;min-width:0;justify-content:center;gap:.2rem;padding:.3rem 0}
      .countdowns-header h2{font-size:.72rem}
      .countdowns-header .icon-btn{width:24px;height:24px;font-size:.65rem}
      #countdown-list{max-height:28px;overflow-y:auto}
      .countdown-item{min-width:0;padding:.25rem .35rem;font-size:.62rem;border-radius:.35rem}
      .kanban-column{width:auto;min-height:0;aspect-ratio:1/1;padding:.45rem;cursor:pointer;overflow:hidden;background:linear-gradient(145deg,rgba(4,38,39,.94),rgba(1,24,27,.97));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(180,255,250,.08),0 8px 24px rgba(0,0,0,.28);transition:opacity .18s ease,visibility .18s ease,box-shadow .28s ease}
      #kanban-backlog{--status-accent:#d0d3d6;background:linear-gradient(145deg,#303236,#191b1e)!important;border-color:#74787d!important}
      #kanban-today{--status-accent:#ffe08a;background:linear-gradient(145deg,#604817,#30250e)!important;border:2px solid #e9b949!important;box-shadow:inset 0 1px 0 rgba(255,245,204,.28),0 0 30px rgba(255,184,38,.34)!important}
      #kanban-in-progress{--status-accent:#70dcff;background:linear-gradient(145deg,#123d52,#0a2634)!important;border-color:#288bb0!important}
      #kanban-done{--status-accent:#83dfb4;background:linear-gradient(145deg,#1d4838,#0d2a21)!important;border-color:#347e60!important}
      #kanban-backlog h2{background:#3a3d41!important}
      #kanban-today h2{background:linear-gradient(90deg,#8a641c,#594211)!important;border-color:#ffd166!important;color:#fff0b8!important}
      #kanban-in-progress h2{background:#10445c!important}
      #kanban-done h2{background:#20503e!important}
      #kanban-container .kanban-column h2{position:relative;top:0!important;z-index:4;display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:42px;box-sizing:border-box;font-family:Orbitron,Roboto,sans-serif;font-weight:900;letter-spacing:.01em;background:color-mix(in srgb,var(--status-accent) 13%,#071315);border:2px solid color-mix(in srgb,var(--status-accent) 52%,transparent);border-radius:6px;padding:.55rem .2rem;margin-bottom:.45rem;font-size:clamp(.82rem,3.7vw,1.05rem);line-height:1.05;white-space:nowrap;cursor:pointer;color:var(--status-accent);text-shadow:0 1px 0 #000}
      .kanban-column h2::after{content:attr(data-count);display:grid;place-items:center;min-width:1.4rem;height:1.4rem;padding:0 .18rem;border-radius:999px;background:color-mix(in srgb,var(--status-accent) 22%,#071315);border:1px solid color-mix(in srgb,var(--status-accent) 62%,transparent);color:var(--status-accent);font-size:.74rem;font-weight:900;line-height:1;text-shadow:none}
      .kanban-column .task-list{display:flex;min-height:0;overflow-y:auto;padding:0 .15rem .25rem;gap:.35rem;pointer-events:auto}
      .kanban-column .task-card{min-height:0;padding:.48rem .52rem;opacity:.92;transform:none;background:rgba(0,0,0,.14);border-color:color-mix(in srgb,var(--status-accent) 28%,transparent);color:var(--status-accent);touch-action:none;user-select:none;-webkit-user-select:none}
      .kanban-column .task-card h3{font-size:.76rem;line-height:1.2;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .kanban-column .subtask-count{font-size:.62rem;margin-top:.18rem}
      .kanban-column:not(.is-expanded) .card-nav{display:none}
      .touch-drag-ghost{position:fixed!important;z-index:10050!important;margin:0!important;pointer-events:none!important;opacity:.92!important;transform:scale(1.04) rotate(1deg)!important;background:#102b30!important;box-shadow:0 14px 38px rgba(0,0,0,.55),0 0 22px rgba(0,255,255,.35)!important}
      .kanban-column.touch-drop-target{outline:2px solid var(--status-accent);outline-offset:-3px;box-shadow:0 0 28px color-mix(in srgb,var(--status-accent) 42%,transparent)!important}
      #kanban-container.has-expanded .kanban-column:not(.is-expanded){opacity:0;visibility:hidden}
      .kanban-column.is-expanded{position:absolute;inset:0;z-index:30;width:100%;height:100%;aspect-ratio:auto;min-height:0;cursor:default;background-color:#031d20!important;background-image:repeating-linear-gradient(100deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 5px),linear-gradient(145deg,#073032 0%,#031d20 55%,#021518 100%)!important;border:1px solid rgba(74,255,244,.52);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 34px rgba(0,255,255,.42),inset 0 1px 0 rgba(190,255,250,.16),inset 0 0 42px rgba(0,255,255,.055);animation:kanban-focus-in .22s ease-out}

  <script>
    /* ===== Firebase: authenticated, per-user cloud sync ===== */
    const firebaseConfig = {
      apiKey: "AIzaSyBeVpUqcRO_VXfQrGVL5OaSGHKFB8XEQMc",
      authDomain: "life-by-adichimp.firebaseapp.com",
      projectId: "life-by-adichimp",
      storageBucket: "life-by-adichimp.firebasestorage.app",
      messagingSenderId: "761981819700",
      appId: "1:761981819700:web:8e88516817ed40b9866361",
      measurementId: "G-Z0Q8WJDSMH"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: 'select_account' });
    const LEGACY_API = "https://script.google.com/macros/s/AKfycbyFO00mXXPQvrq7mSNhlmaaSerOlDIfhNeMhkT0De__97vTTNZ0CKxsTDfLtkCVW_h8JA/exec";
    let currentUser = null;
    let liveUnsubscribers = [];

    function userRoot(){
      if(!currentUser) throw new Error('Sign in is required.');
      return db.collection('users').doc(currentUser.uid);
    }

    async function legacyApi(action, body={}){
      const res = await fetch(LEGACY_API, { method:'POST', body: JSON.stringify({ action, body }) });
      const json = await res.json();
      if(!json.ok) throw new Error(json.error || 'Legacy API error');
      return json.data;
    }

    async function api(action, body={}){
      const root = userRoot();
      switch(action){
        case 'getAll': {
          const [taskSnap, countdownSnap, streakSnap] = await Promise.all([
            root.collection('tasks').get(),
            root.collection('countdowns').get(),
            root.collection('streaks').get()
          ]);
          const streakValues = {};
          const streakTimes = {};
          streakSnap.docs.forEach(doc => {
            const item = doc.data();
            streakValues[doc.id] = Number(item.value || 0);
            streakTimes[doc.id] = Number(item.updatedAt || 0);
          });
          return {
            tasks: taskSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })),
            countdowns: countdownSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })),
            streaks: streakValues,
            streakLast: streakTimes
          };
        }
        case 'upsertTask':
          await root.collection('tasks').doc(body.id).set({ ...body, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
          return {};
        case 'deleteTask':
          await root.collection('tasks').doc(body.id).delete();
          return {};
        case 'updateStreak':
          await root.collection('streaks').doc(body.type).set({
            value: body.value,
            updatedAt: body.updatedAt || Date.now()
          }, { merge:true });
          return {};
        case 'addCountdown':
          await root.collection('countdowns').doc(body.id).set({ ...body, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
          return {};
        case 'deleteCountdown':
          await root.collection('countdowns').doc(body.id).delete();
          return {};
        default:
          throw new Error('Unknown data action: ' + action);
      }
    }

    function stopRealtimeSync(){
      liveUnsubscribers.forEach(unsubscribe => unsubscribe());
      liveUnsubscribers = [];
    }

    function startRealtimeSync(){
      stopRealtimeSync();
      const root = userRoot();
      liveUnsubscribers.push(
        root.collection('tasks').onSnapshot(snapshot => {
          tasks = snapshot.docs.map(doc => ({ id:doc.id, ...doc.data() }));
          renderTasks();
        }, showSyncError),
        root.collection('countdowns').onSnapshot(snapshot => {
          countdowns = snapshot.docs.map(doc => ({ id:doc.id, ...doc.data() }));
          renderCountdowns();
        }, showSyncError),
        root.collection('streaks').onSnapshot(snapshot => {
          const values = {};
          const times = {};
          snapshot.docs.forEach(doc => {
            const item = doc.data();
            values[doc.id] = Number(item.value || 0);
            times[doc.id] = Number(item.updatedAt || 0);
          });
          streaks = normalizeStreaks(values);
          streakLast = times;
          renderStreaks();
        }, showSyncError)
      );
    }

    function showSyncError(err){
      console.error('Cloud sync failed:', err);
      const status = document.getElementById('sync-status');
      if(status) status.textContent = 'Sync error';
    }

    function setupAuthUi(){
      const overlay = document.createElement('div');
      overlay.id = 'auth-overlay';
      overlay.innerHTML = `
        <div class="auth-card">
          <i class="fab fa-google auth-icon"></i>
          <h2>INVINCIBLE</h2>
          <p>Sign in with the same Google account on every device to keep your dashboard synced.</p>
          <button id="google-sign-in"><i class="fab fa-google"></i> Continue with Google</button>
          <div id="auth-error"></div>
        </div>`;
      document.body.appendChild(overlay);

      const userBar = document.createElement('details');
      userBar.id = 'user-bar';
      userBar.innerHTML = `
        <summary title="Cloud sync and account"><i class="fas fa-cloud" aria-hidden="true"></i><span id="sync-status">Synced</span></summary>
        <div class="sync-menu">
          <span id="user-email"></span>
          <button id="legacy-import" title="Merge data from the old dashboard">Import old data</button>
          <button id="sign-out">Sign out</button>
        </div>`;
      document.querySelector('#time-and-date-row .controls').prepend(userBar);

      document.getElementById('google-sign-in').addEventListener('click', async ()=>{
        const button = document.getElementById('google-sign-in');
        button.disabled = true;
        document.getElementById('auth-error').textContent = '';
        try{
          await auth.signInWithPopup(googleProvider);
        }catch(err){
          console.error('Sign-in failed:', err);
          document.getElementById('auth-error').textContent = err.message || 'Sign-in failed.';
        }finally{
          button.disabled = false;
        }
      });
      document.getElementById('sign-out').addEventListener('click', ()=> auth.signOut());
      document.getElementById('legacy-import').addEventListener('click', importLegacyData);
    }

    async function importLegacyData(){
      if(!currentUser || !confirm('Merge tasks, streaks and countdowns from the old dashboard into this account?')) return;
      const button = document.getElementById('legacy-import');
      button.disabled = true;
      button.textContent = 'Importing...';
      try{
        const old = await legacyApi('getAll');
        const writes = [];
        (old.tasks || []).forEach(task => {
          if(task.id) writes.push(userRoot().collection('tasks').doc(task.id).set(task, { merge:true }));
        });
        (old.countdowns || []).forEach(item => {
          if(item.id) writes.push(userRoot().collection('countdowns').doc(item.id).set(item, { merge:true }));
        });
        if(old.streaks){
          const importedStreaks = normalizeStreaks(old.streaks);
          ['body','mind','spirit'].forEach(type => {
            writes.push(userRoot().collection('streaks').doc(type).set({
              value: importedStreaks[type],
              updatedAt: Date.now()
            }, { merge:true }));
          });
        }
        await Promise.all(writes);
        alert('Old dashboard data imported.');
      }catch(err){
        console.error('Legacy import failed:', err);
        alert('Old data could not be imported. Your Firestore data was not removed.');
      }finally{
        button.disabled = false;
        button.textContent = 'Import old data';
      }
    }

    function updateAuthUi(user){
      document.getElementById('auth-overlay').classList.toggle('hidden', !!user);
      document.getElementById('user-bar').classList.toggle('visible', !!user);
      document.getElementById('user-email').textContent = user ? user.email : '';
    }

    /* ===== State ===== */
    let dragId = null;
    let tasks=[], streaks={}, streakLast={}, countdowns=[];
    let draggedTask=null, originalStatus=null, suppressCardClick=false;
    const STATUSES = ['Backlog','In Progress','Today','Done'];

    function normalizeStreaks(s){
      const read = (x)=> typeof x === 'number' ? x : (x && (x.streak ?? x.value ?? x.count ?? 0)) || 0;
      return { body: read(s?.body), mind: read(s?.mind), spirit: read(s?.spirit) };
    }

    async function resetStreaksIfNeeded(){
      const now = Date.now();
      for(const type of ['body','mind','spirit']){
        const last = Number(streakLast[type] || 0);
        if(now - last > 86400000 && streaks[type] !== 0){
          streaks[type] = 0;
          try{ await api('updateStreak', { type, value: 0 }); }catch(err){ console.error('Reset failed', err); }
        }
      }
      renderStreaks();
    }

    /* ===== Elements ===== */
    const taskLists = {
      "Backlog": document.querySelector('#kanban-backlog .task-list'),
      "Today": document.querySelector('#kanban-today .task-list'),
      "In Progress": document.querySelector('#kanban-in-progress .task-list'),
      "Done": document.querySelector('#kanban-done .task-list'),
    };
    const modalOverlay = document.getElementById('task-modal-overlay');
    const modal = document.getElementById('task-modal');
    const modalTitleEl = modal.querySelector('h2');
    const modalTitle = document.getElementById('modal-title');
    const modalDescription = document.getElementById('modal-description');
    const modalStatus = document.getElementById('modal-status');
    const modalSubtasks = document.getElementById('modal-subtasks-list');
    const saveTaskBtn = document.getElementById('save-task-btn');
    const deleteTaskBtn = document.getElementById('delete-task-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const addSubtaskBtn = document.getElementById('add-subtask-btn');
    const addTaskBtnTop = document.getElementById('add-task-btn-top');

    let saving = false;
    let deleting = false;

    const countdownListEl = document.getElementById('countdown-list');
    const toggleMini = document.getElementById('toggle-ctd-form');
    const miniWrap = document.getElementById('countdown-mini');
    const miniTitle = document.getElementById('countdown-mini-title');
    const miniDate  = document.getElementById('countdown-mini-datetime');
    const miniAdd   = document.getElementById('mini-add');

    /* ===== Load + render ===== */
    async function fetchDataAndRender(){
      const data = await api("getAll");
      tasks = data.tasks || [];
      streaks = normalizeStreaks(data.streaks || {});
      countdowns = data.countdowns || [];
      streakLast = data.streakLast || {};
      renderTasks();
      await resetStreaksIfNeeded();
      renderCountdowns();
    }

    function taskProgress(task){
      const subs = (Array.isArray(task.steps) && task.steps.length ? task.steps : task.subtasks) || [];
      const done = subs.filter(s=>s.done || s.status === 'Done').length;
      const total = subs.length;
      return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
    }
    function chooseFocusTask(){
      const active = tasks.filter(task => task.status !== 'Done');
      const pool = active.filter(task => task.status === 'Today' || task.status === 'In Progress');
      const source = pool.length ? pool : active;
      return [...source].sort((a,b)=>{
        const priority = status => status === 'Today' ? 3 : status === 'In Progress' ? 2 : status === 'Backlog' ? 1 : 0;
        const ap = taskProgress(a), bp = taskProgress(b);
        return priority(b.status) - priority(a.status) || bp.pct - ap.pct || bp.done - ap.done || String(b.updatedAt?.seconds || b.updatedAt || '').localeCompare(String(a.updatedAt?.seconds || a.updatedAt || ''));
      })[0] || null;
    }
    function renderFocusPanel(focusTask){
      const panel = document.getElementById('focus-panel');
      if(!panel) return;
      const title = document.getElementById('focus-title');
      const detail = document.getElementById('focus-detail');
      const bar = document.getElementById('focus-meter-bar');
      const percent = document.getElementById('focus-percent');
      const action = document.getElementById('focus-action');
      const hasDone = tasks.some(task=>task.status==='Done');
      if(!focusTask){
        title.textContent = hasDone ? 'All active tasks are clear.' : 'Create one clear task for today.';
        detail.textContent = hasDone ? 'Good. Nothing is shouting for attention right now.' : 'No popup needed. Add the next real move and keep it visible here.';
        bar.style.width = hasDone ? '100%' : '0%';
        percent.textContent = hasDone ? '100%' : '0%';
        action.href = '#';
        action.textContent = hasDone ? 'Review' : 'New Task';
        action.onclick = hasDone ? null : event => { event.preventDefault(); openModal({ id:null, title:'', description:'', status:'Today', subtasks:[] }); };
        return;
      }
      const progress = taskProgress(focusTask);
      title.textContent = focusTask.title || 'Untitled task';
      detail.textContent = progress.total ? `${focusTask.status} · ${progress.done} of ${progress.total} steps done · nearest to completion` : `${focusTask.status} · no steps yet · define the first tiny action`;
      bar.style.width = `${progress.pct}%`;
      percent.textContent = `${progress.pct}%`;
      action.href = `/invincible/task/?id=${encodeURIComponent(focusTask.id)}`;
      action.textContent = progress.pct >= 80 ? 'Finish' : 'Continue';
      action.onclick = null;
    }

    function renderTasks(){
      Object.values(taskLists).forEach(list=> list.innerHTML='');
      const focusTask = chooseFocusTask();
      renderFocusPanel(focusTask);
      tasks.forEach(task=>{
        const el = document.createElement('div');
        el.className = `task-card ${focusTask?.id === task.id ? 'is-focus-task' : ''}`.trim(); el.draggable = !window.matchMedia('(pointer: coarse)').matches; el.dataset.id = task.id;
        const subs = (Array.isArray(task.steps) && task.steps.length ? task.steps : task.subtasks) || []; const done = subs.filter(s=>s.done || s.status === 'Done').length; const total = subs.length;
        el.innerHTML = `
          <div class="card-nav">
            <button class="nav-left" title="Move left">‹</button>
            <button class="nav-right" title="Move right">›</button>
          </div>
          <h3>${escapeHtml(task.title||'')}</h3>
          <div class="subtask-count">${ total? `${done}/${total}` : 'No'} subtasks</div>`;

        const pos = STATUSES.indexOf(task.status);
        const leftBtn = el.querySelector('.nav-left');
        const rightBtn = el.querySelector('.nav-right');
        leftBtn.disabled = (pos<=0); rightBtn.disabled = (pos>=STATUSES.length-1);
        leftBtn.addEventListener('click', ev=>{ ev.stopPropagation(); moveTask(task.id,-1); });
        rightBtn.addEventListener('click',ev=>{ ev.stopPropagation(); moveTask(task.id,+1); });

        el.addEventListener('click', event=> {
          if(suppressCardClick){ event.preventDefault(); event.stopPropagation(); return; }
          window.location.href = `/invincible/task/?id=${encodeURIComponent(task.id)}`;
        });
        el.addEventListener('dragstart', e=>{
          draggedTask = task.id; dragId = task.id; originalStatus = task.status;
          if(e.dataTransfer){ e.dataTransfer.setData('text/plain', task.id); e.dataTransfer.effectAllowed='move'; }
          el.classList.add('dragging');
        });
        el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); draggedTask=null; dragId=null; });
        attachMobileDrag(el, task);
        (taskLists[task.status] || taskLists.Backlog).appendChild(el);
      });
      document.querySelectorAll('.kanban-column').forEach(column=>{
        const heading = column.querySelector('h2');
        const count = column.querySelectorAll('.task-card').length;
        if(heading) heading.dataset.count = count;
      });
      const focusEl = focusTask ? document.querySelector(`.task-card[data-id="${CSS.escape(focusTask.id)}"]`) : null;
      focusEl?.scrollIntoView({ block:'nearest' });
    }

    function attachMobileDrag(card, task){
      let state=null, holdTimer=null;
      const clearTargets=()=> document.querySelectorAll('.kanban-column.touch-drop-target').forEach(col=>col.classList.remove('touch-drop-target'));
      const cancel=()=>{ const wasDragging=!!state?.dragging; clearTimeout(holdTimer); state?.ghost?.remove(); clearTargets(); state=null; if(wasDragging) setTimeout(()=>{ suppressCardClick=false; },350); };

      const begin=()=>{
        if(!state || state.dragging) return;
        state.dragging=true; suppressCardClick=true;
        const rect=card.getBoundingClientRect();
        const ghost=card.cloneNode(true); ghost.classList.add('touch-drag-ghost');
        ghost.style.width=rect.width+'px'; ghost.style.left=(state.x-rect.width/2)+'px'; ghost.style.top=(state.y-rect.height/2)+'px';
        document.body.appendChild(ghost); state.ghost=ghost;
        if(navigator.vibrate) navigator.vibrate(25);
      };

      card.addEventListener('pointerdown', event=>{
        if(!window.matchMedia('(max-width: 768px)').matches || event.pointerType==='mouse' || !event.isPrimary) return;
        state={pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,dragging:false,ghost:null};
        try{ card.setPointerCapture(event.pointerId); }catch{}
        holdTimer=setTimeout(begin,180);
      });

      card.addEventListener('pointermove', event=>{
        if(!state || event.pointerId!==state.pointerId) return;
        state.x=event.clientX; state.y=event.clientY;
        if(!state.dragging && Math.hypot(state.x-state.startX,state.y-state.startY)>6) begin();
        if(!state.dragging) return;
        event.preventDefault();
        const rect=state.ghost.getBoundingClientRect();
        state.ghost.style.left=(state.x-rect.width/2)+'px'; state.ghost.style.top=(state.y-rect.height/2)+'px';
        clearTargets();
        document.elementFromPoint(state.x,state.y)?.closest('.kanban-column')?.classList.add('touch-drop-target');
      });

      const finish=event=>{
        clearTimeout(holdTimer);
        if(!state?.dragging){ state=null; return; }
        event.preventDefault();
        const target=document.elementFromPoint(state.x,state.y)?.closest('.kanban-column');
        const newStatus=target?.querySelector('.task-list')?.dataset.status;
        state.ghost?.remove(); clearTargets(); state=null;
        if(newStatus && newStatus!==task.status) moveTaskToStatus(task.id,newStatus);
        setTimeout(()=>{ suppressCardClick=false; },350);
      };
      card.addEventListener('pointerup',finish);
      card.addEventListener('pointercancel',cancel);
    }

    async function moveTaskToStatus(taskId,newStatus){
      const taskObj=tasks.find(item=>item.id===taskId); if(!taskObj || taskObj.status===newStatus) return;
      const previous=taskObj.status; taskObj.status=newStatus; renderTasks();
      try{ await api('upsertTask',taskObj); }
      catch(err){ console.error('Touch move failed, rolling back',err); taskObj.status=previous; renderTasks(); }
    }

    /* Mobile Kanban: four glanceable tiles, one focused board at a time. */
    document.querySelectorAll('.kanban-column').forEach(column=>{
      const heading = column.querySelector('h2');
      heading.setAttribute('role','button');
      heading.setAttribute('tabindex','0');
      heading.setAttribute('aria-expanded','false');

      const toggleMobileColumn = ()=>{
        if(!window.matchMedia('(max-width: 768px)').matches) return;
        const opening = !column.classList.contains('is-expanded');
        const board = document.getElementById('kanban-container');
        document.querySelectorAll('.kanban-column').forEach(other=>{
          other.classList.remove('is-expanded');
          other.querySelector('h2')?.setAttribute('aria-expanded','false');
        });
        board.classList.toggle('has-expanded', opening);
        if(opening){
          column.classList.add('is-expanded');
          heading.setAttribute('aria-expanded','true');
          requestAnimationFrame(()=>column.scrollIntoView({behavior:'smooth',block:'start'}));
        }
      };

      heading.addEventListener('click', toggleMobileColumn);
      heading.addEventListener('keydown', event=>{
        if(event.key === 'Enter' || event.key === ' '){
          event.preventDefault();
          toggleMobileColumn();
        }
      });
      column.addEventListener('click', event=>{
        if(event.target.closest('.task-card') || event.target.closest('h2')) return;
        toggleMobileColumn();
      });
    });

    let currentTask=null;
    function openModal(task){
      currentTask = task;
      modalTitle.value = task.title || '';
      modalDescription.value = task.description || '';
      modalStatus.value = task.status || 'Backlog';
      renderSubtasks(task.subtasks || []);
      modalTitleEl.textContent = task.id ? 'Edit Task' : 'New Task';
      deleteTaskBtn.style.display = task.id ? 'block' : 'none';
      modalOverlay.classList.add('open');
    }
    function renderSubtasks(subtasks){
      modalSubtasks.innerHTML='';
      subtasks.forEach(st=>{
        const row = document.createElement('div');
        row.className = 'subtask-item';
        row.innerHTML = `
          <input type="checkbox" ${st.done ? 'checked' : ''}>
          <input type="text" value="${escapeHtml(st.text||'')}">
          <button class="delete-subtask-btn" style="background:none;border:none;color:white;cursor:pointer"><i class="fas fa-trash"></i></button>`;
        row.querySelector('.delete-subtask-btn').addEventListener('click', ()=> row.remove());
        modalSubtasks.appendChild(row);
      });
    }
    function closeModal(){ modalOverlay.classList.remove('open'); currentTask=null; }

    saveTaskBtn.addEventListener('click', async () => {
      if (saving) return;
      saving = true;

      const newSubtasks = Array.from(modalSubtasks.querySelectorAll('.subtask-item')).map(item=>({
        text: item.querySelector('input[type="text"]').value,
        done: item.querySelector('input[type="checkbox"]').checked
      }));

      const updatedTask = {
        id: currentTask ? currentTask.id : null,
        title: modalTitle.value,
        description: modalDescription.value,
        status: modalStatus.value,
        subtasks: newSubtasks
      };

      const originalState = JSON.parse(JSON.stringify(tasks));
      closeModal();
      
      const isNewTask = !updatedTask.id;
      if (isNewTask) {
        updatedTask.id = 't_' + Date.now();
        tasks.push(updatedTask);
      } else {
        const index = tasks.findIndex(t => t.id === updatedTask.id);
        if (index !== -1) {
          tasks[index] = updatedTask;
        }
      }
      renderTasks();

      try {
        await api('upsertTask', updatedTask);
      } catch (err) {
        console.error('Save failed', err);
        alert('Save failed. Rolling back changes.');
        tasks = originalState;
        renderTasks();
      } finally {
        saving = false;
        saveTaskBtn.disabled = false;
        saveTaskBtn.textContent = 'Save';
      }
    });

    async function handleDelete(){
      if (deleting) return;
      const id = currentTask && currentTask.id;
      if (!id) { alert('Cannot delete: missing task id.'); return; }
      deleting = true;
      
      const originalState = JSON.parse(JSON.stringify(tasks));
      closeModal();
      
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
      
      try {
        await api('deleteTask', { id });
      } catch (err) {
        console.error('Delete failed', err);
        alert('Delete failed. Rolling back changes.');
        tasks = originalState;
        renderTasks();
      } finally {
        deleting = false;
      }
    }

    deleteTaskBtn.addEventListener('click', handleDelete);
    closeModalBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e=>{ if(e.target.id==='task-modal-overlay') closeModal(); });
    window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

    addSubtaskBtn.addEventListener('click', ()=>{
      const row = document.createElement('div'); row.className='subtask-item';
      row.innerHTML = `<input type="checkbox"><input type="text" placeholder="New subtask text"><button class="delete-subtask-btn" style="background:none;border:none;color:white;cursor:pointer"><i class="fas fa-trash"></i></button>`;
      row.querySelector('.delete-subtask-btn').addEventListener('click', ()=> row.remove());
      modalSubtasks.appendChild(row);
    });

    addTaskBtnTop.addEventListener('click', ()=> openModal({ id:null, title:'', description:'', status:'Backlog', subtasks:[] }));

    /* ===== Drag & Drop ===== */
    document.querySelectorAll('.kanban-column').forEach(column=>{
      column.addEventListener('dragover', e=>{ e.preventDefault(); column.style.boxShadow='0 0 15px rgba(0,255,255,.4)'; if(e.dataTransfer) e.dataTransfer.dropEffect='move'; });
      column.addEventListener('dragleave', ()=>{ column.style.boxShadow='0 0 15px rgba(0,255,255,.2)'; });
      column.addEventListener('drop', async e=>{
        e.preventDefault(); column.style.boxShadow='0 0 15px rgba(0,255,255,.2)';
        const taskId = e.dataTransfer?.getData('text/plain') || dragId || draggedTask; if(!taskId) return;
        const newStatus = column.querySelector('.task-list').dataset.status;
        const card = document.querySelector(`.task-card[data-id="${taskId}"]`); const oldParent = card?.parentElement;
        if(taskLists[newStatus] && card){ taskLists[newStatus].appendChild(card); }
        
        const taskObj = tasks.find(t=> t.id === taskId);
        if(taskObj && taskObj.status !== newStatus){
          const prev = taskObj.status;
          taskObj.status = newStatus;
          // Optimistically update UI
          renderTasks(); 
          try{ await api('upsertTask', taskObj); }
          catch(err){ 
            console.error('Update failed, rolling back', err); 
            taskObj.status = prev; 
            renderTasks(); 
          }
        }
      });
    });

    /* ===== Streaks ===== */
    document.querySelectorAll('.streak-button').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const type = btn.dataset.type;
        const prevStreaks = JSON.parse(JSON.stringify(streaks));
        const now = Date.now();
        const last = Number(streakLast[type] || 0);
        if(now - last > 86400000){
          streaks[type] = 1;
        } else {
          streaks[type] = streaks[type] + 1;
        }
        streakLast[type] = now;
        renderStreaks();
        try{
          await api('updateStreak',{ type, value: streaks[type], updatedAt: now });
        } catch(err){
          console.error('Streak update failed, rolling back', err);
          streaks = prevStreaks;
          renderStreaks();
        }
      });
    });

    function renderStreaks(){
      const n = (v)=> typeof v === 'number' ? v : (v && (v.streak ?? v.value ?? v.count ?? 0)) || 0;
      document.getElementById('streak-body').textContent = n(streaks.body);
      document.getElementById('streak-mind').textContent = n(streaks.mind);
      document.getElementById('streak-spirit').textContent = n(streaks.spirit);
    }

    async function moveTask(taskId, delta){
      const idx = tasks.findIndex(t => t.id === taskId); 
      if (idx < 0) return;
      const t = tasks[idx]; 
      const curPos = STATUSES.indexOf(t.status);
      const nextPos = Math.min(STATUSES.length-1, Math.max(0, curPos + delta)); 
      if (nextPos === curPos) return;

      const newStatus = STATUSES[nextPos];
      const prevStatus = t.status;
      t.status = newStatus;

      renderTasks(); // Optimistically update UI

      try{
        await api('upsertTask', t);
      }catch(err){ 
        console.error('Move failed, rolling back', err); 
        t.status = prevStatus; 
        renderTasks(); 
      }
    }

    /* ===== Countdowns ===== */
    function renderCountdowns(){
      countdownListEl.innerHTML='';
      countdowns.forEach(c=>{
        const item = document.createElement('div'); item.className='countdown-item'; item.dataset.id=c.id;
        const del = document.createElement('button'); del.innerHTML='<i class="fas fa-trash"></i>';
        del.addEventListener('click', async ()=>{ 
          const originalState = JSON.parse(JSON.stringify(countdowns));
          countdowns = countdowns.filter(cd => cd.id !== c.id);
          renderCountdowns(); // Optimistically update
          try{
            await api('deleteCountdown', { id:c.id });
          } catch (err){
            console.error('Delete failed, rolling back', err);
            countdowns = originalState;
            renderCountdowns();
          }
        });
        item.innerHTML = `<span>${escapeHtml(c.title)}: <span class="time-left"></span></span>`;
        item.appendChild(del); countdownListEl.appendChild(item);
      });
    }

    toggleMini.addEventListener('click', ()=>{
      miniWrap.classList.toggle('hidden');
      if(!miniWrap.classList.contains('hidden')) miniTitle.focus();
    });
    miniAdd.addEventListener('click', async ()=>{
      const title = miniTitle.value.trim(); const val = miniDate.value;
      if(!title || !val) return; 

      const target_iso = new Date(val).toISOString();
      const newCountdown = { id: 'c_' + Date.now(), title, target_iso };
      const originalState = JSON.parse(JSON.stringify(countdowns));

      countdowns.push(newCountdown);
      miniTitle.value=''; miniDate.value=''; miniWrap.classList.add('hidden');
      renderCountdowns(); // Optimistically update

      try{
        await api('addCountdown', newCountdown);
      } catch(err) {
        console.error('Add failed, rolling back', err);
        countdowns = originalState;
        renderCountdowns();
      }
    });

    // Big live clock + date in right panel
    const timeEl = document.getElementById('live-clock-time');
    const dateEl = document.getElementById('live-clock-date');
    setInterval(()=>{
      const now = new Date();
      timeEl.textContent = now.toLocaleTimeString([], { hour12:false });
      dateEl.textContent = now.toLocaleDateString([], { weekday:'short', day:'2-digit', month:'short', year:'numeric' });

      document.querySelectorAll('.countdown-item').forEach(item=>{
        const c = countdowns.find(x=> x.id === item.dataset.id);
        if(!c) return; 
        const diff = new Date(c.target_iso) - now;
        item.querySelector('.time-left').textContent =
          diff>0 ? `${Math.floor(diff/86400000)}d ${Math.floor(diff%86400000/3600000)}h ${Math.floor(diff%3600000/60000)}m ${Math.floor(diff%60000/1000)}s` : 'EXPIRED';
      });
    },1000);

    /* ===== Particles ===== */
    (function(){
      const canvas = document.getElementById('particles-js');
      const ctx = canvas.getContext('2d');
      let width,height; let particles=[]; const count=100; const maxDist=100;
      function resize(){ width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();
      class Particle{ constructor(){ this.x=Math.random()*width; this.y=Math.random()*height; this.vx=(Math.random()-.5)*.5; this.vy=(Math.random()-.5)*.5; this.r=Math.random()*1.5+.5; } update(){ this.x+=this.vx; this.y+=this.vy; if(this.x<0||this.x>width) this.vx*=-1; if(this.y<0||this.y>height) this.vy*=-1; } draw(){ ctx.beginPath(); ctx.fillStyle='#00ffff'; ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); }}
      function connect(){ for(let a=0;a<count;a++){ for(let b=a+1;b<count;b++){ const dx=particles[a].x-particles[b].x, dy=particles[a].y-particles[b].y; const d=Math.hypot(dx,dy); if(d<maxDist){ ctx.beginPath(); ctx.strokeStyle=`rgba(0,255,255,${1-d/maxDist})`; ctx.lineWidth=.5; ctx.moveTo(particles[a].x,particles[a].y); ctx.lineTo(particles[b].x,particles[b].y); ctx.stroke(); } } } }
      particles = Array.from({length:count}, ()=> new Particle());
      (function loop(){ ctx.clearRect(0,0,width,height); particles.forEach(p=>{ p.update(); p.draw(); }); connect(); requestAnimationFrame(loop); })();
    })();

    /* ===== Helpers ===== */
    function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;' }[m])); }

    /* ===== Boot (wrap awaits inside async) ===== */
    async function init(){
      setupAuthUi();
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      auth.onAuthStateChanged(async user => {
        stopRealtimeSync();
        currentUser = user;
        updateAuthUi(user);
        if(!user){
          tasks = []; streaks = {}; streakLast = {}; countdowns = [];
          renderTasks(); renderStreaks(); renderCountdowns();
          return;
        }
        try{
          await fetchDataAndRender();
          startRealtimeSync();
          document.getElementById('sync-status').textContent = 'Synced';
        }catch(err){
          showSyncError(err);
        }
      });
    }
    init();

    /* ===== Tests (toggle on when needed) ===== */
    const DEV_TESTS = false; // set to true in console to run
    if (DEV_TESTS) {
      (async function runTests(){
        console.log('[TEST] starting');
        // Test 1: modal open/close
        const fake = { id:null, title:'Test', description:'', status:'Backlog', subtasks:[] };
        openModal(fake);
        console.assert(modalOverlay.classList.contains('open'), 'Modal should open');
        closeModal();
        console.assert(!modalOverlay.classList.contains('open'), 'Modal should close');

        // Test 2: deleting captures id BEFORE closeModal
        const realApi = api; // mock API
        const calls = [];
        api = async (action, body)=>{ calls.push({action, body}); return action==='getAll'?{tasks:[],streaks:{},countdowns:[]}:{ } };
        const deletable = { id:'t1', title:'X', description:'', status:'Backlog', subtasks:[] };
        openModal(deletable);
        await handleDelete();
        console.assert(calls.some(c=>c.action==='deleteTask' && c.body && c.body.id==='t1'), 'deleteTask should be called with correct id');
        api = realApi; // restore

        console.log('[TEST] passed');
      })();
    }
  </script>
