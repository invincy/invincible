name: Verify step copy branch

on:
  push:
    branches: [feat/step-notes-copy]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix react
      - run: npm ci --prefix functions
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - run: npm run build
      - run: npm run check
      - run: CHROMIUM_EXECUTABLE="$(node -p "require('playwright').chromium.executablePath()")" node tests/task-copy-browser.cjs
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-dist index.html ai/index.html task/index.html workday/index.html journal/finance.html reminders/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build step copy assets"
            git push
          fi
