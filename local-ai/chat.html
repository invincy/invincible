<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Invincible · Local Studio</title><link rel="stylesheet" href="/creator/image-generator.css"><style>
body{margin:0;background:#061217;color:#e5f3f5;font:14px/1.5 system-ui,sans-serif}main{max-width:960px;margin:40px auto;padding:0 20px}h1{font-size:25px;letter-spacing:.04em}nav{display:flex;align-items:center;gap:16px;border-bottom:1px solid #24444b;padding-bottom:18px}nav span{color:#94b1bb}section.chat{padding:24px;border:1px solid #24444b;border-radius:18px;margin-top:20px}input,select,button{font:inherit;color:inherit;border:1px solid #34545c;border-radius:8px;background:#10252e;padding:10px}button{cursor:pointer}#log{white-space:pre-wrap;min-height:80px;max-height:250px;overflow:auto;color:#a8c2ca}.row{display:flex;gap:10px;margin:12px 0}.row input{flex:1;min-width:0}#projects{max-width:100%}#connection{color:#a8c2ca}.image-generator{margin-left:0;margin-right:0;max-width:none}@media(max-width:500px){main{margin:20px auto;padding:0 12px}.row{flex-wrap:wrap}}
</style></head><body><main><nav><strong>INVINCIBLE</strong><span>Local Studio · isolated workspace</span></nav><h1>Make something visual.</h1><p id="connection" role="status">Connect to the local worker from Advanced settings below.</p><div class="row"><select id="projects" aria-label="Current local project"><option value="">No project selected</option></select><button id="new-project">New test project</button></div><section id="images" aria-label="Image generation"></section><section class="chat"><h2>Ask Invincible</h2><div id="log" role="log">Qwen can use the same Generate image tool. Manual generation above does not need Qwen.</div><form id="chat-form" class="row"><input id="message" maxlength="4000" aria-label="Message Invincible" placeholder="Generate a square illustration of a medieval Indian fortress"><button id="send">Send</button></form></section></main><script type="module">
import {createLocalImageClient} from '/local-ai/image-client.js';
import {mountImageGenerator} from '/creator/image-generator.js';
const client=createLocalImageClient({origin:location.origin}),projects=document.querySelector('#projects'),log=document.querySelector('#log');
const panel=mountImageGenerator(document.querySelector('#images'),{client,getProjectId:()=>projects.value,onAttach:async(file,job)=>{await client.request('/api/projects/'+encodeURIComponent(projects.value)+'/assets',{generationId:job.id});await refresh();}});
async function refresh(){const selected=projects.value,{projects:rows}=await client.request('/api/projects');projects.replaceChildren(new Option('No project selected',''),...rows.map(p=>new Option(p.title+' · '+p.assets.length+' assets',p.id)));if(rows.some(p=>p.id===selected))projects.value=selected;}
await panel.ready;try{const session=await client.connect();document.querySelector('#connection').textContent=session.storage.available?'Connected · files stay in your local workspace':session.storage.error;await refresh();}catch{}
document.querySelector('#new-project').onclick=async()=>{try{const {project}=await client.request('/api/projects',{title:'Image generation test · '+new Date().toLocaleDateString(),idempotencyKey:crypto.randomUUID()});await refresh();projects.value=project.id;}catch(e){document.querySelector('#connection').textContent=e.message;}};
document.querySelector('#chat-form').onsubmit=async event=>{event.preventDefault();const input=document.querySelector('#message'),message=input.value.trim();if(!message)return;document.querySelector('#send').disabled=true;log.textContent+='\nYou: '+message+'\nInvincible: working…';try{const result=await client.command(message,crypto.randomUUID());if(result.job){log.textContent+='\nImage request queued.';await panel.showJob(result.job);const last=(await client.job(result.job.id)).job;log.textContent+='\n'+(last.status==='completed'&&last.verified?'Image completed and verified.':'Image failed: '+(last.error?.message||last.status));}else log.textContent+='\n'+(result.text||result.result?.result?.action?.summary||'No action completed.');await refresh();}catch(e){log.textContent+='\nFailed: '+e.message;}finally{document.querySelector('#send').disabled=false;}};
</script></body></html>
