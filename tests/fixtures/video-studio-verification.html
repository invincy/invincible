<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Studio verification</title><link rel="stylesheet" href="../../creator/video-studio/studio.css"><link rel="stylesheet" href="../../creator/production-workbench.css"><style>body{background:#071426;color:#e5eaf0;font:16px system-ui;margin:24px}button,a{color:#edc46a}pre{white-space:pre-wrap;overflow-wrap:anywhere}video{max-width:240px;max-height:360px}.result{display:inline-grid;margin:12px}.tests{padding:16px;background:#122439;margin-bottom:16px;border-radius:12px}</style></head><body>
<section class="tests"><h1>Video Studio verification</h1><p>Local synthetic data only. Encodes and independently decodes real MP4s, measures audio energy/onset against a visual cue, checks branding, cancellation, original media bytes, LIC graphics and Map adapter.</p><button id="verify">Run media verification</button><p role="status" id="status">Ready</p><pre id="results"></pre><div id="videos"></div></section><div id="studio"></div>
<script type="module">
import {verifyMedia} from './video-studio-verification.js';
import {createProductionWorkbench} from '../../creator/production-workbench.js';
const status=document.querySelector('#status'),results=document.querySelector('#results');
document.querySelector('#verify').onclick=async()=>{document.querySelector('#verify').disabled=true;results.textContent='';try{const output=await verifyMedia(text=>status.textContent=text,(blob,name)=>{const wrapper=document.createElement('div');wrapper.className='result';const video=document.createElement('video');video.controls=true;video.src=URL.createObjectURL(blob);const link=document.createElement('a');link.href=video.src;link.download='studio-'+name+'.mp4';link.textContent='Download '+name+' MP4';wrapper.append(video,link);document.querySelector('#videos').append(wrapper);});results.textContent=JSON.stringify(output,null,2);status.textContent='PASS — decoded audio is audible; sync within one frame; dimensions, brand templates, LIC and Map adapters, cancellation and original bytes verified.';}catch(e){status.textContent='FAIL — '+e.message;results.textContent=e.stack;}finally{document.querySelector('#verify').disabled=false;}};
const project={id:'verification',scenes:[],title:'Fixture'};const workbench=createProductionWorkbench(document.querySelector('#studio'),{getProject:()=>project,enableVideoStudio:true,getAccountId:()=>null,onChange:()=>{throw Error('Unexpected legacy project write');},copyText:async()=>{}});workbench.render();
</script></body></html>
