name: V2 prototype verification

on:
  pull_request:
    paths:
      - 'creator/**'
      - 'lic/**'
      - 'react/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/**'
      - 'functions/**'
      - 'functions-tts/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firebase.crm-test.json'
      - 'firebase.creator-test.json'
      - 'package*.json'
      - '.github/workflows/v2-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lic-presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/lic-presentation.mjs
      - run: node tests/lic-opening-browser.cjs && node tests/lic-business-events-browser.cjs && node tests/lic-journey-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lic-presentation-evidence
          path: .test-output/lic-*/*.png
          if-no-files-found: ignore
          include-hidden-files: true
  lic-agent-crm:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix react
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/lic-agent-crm.mjs tests/lic-crm-service.mjs
      - run: node tests/lic-crm-browser.cjs && npm run test:crm:browser
  journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/journal-layout.mjs tests/storage-regressions.mjs
      - run: node tests/journal-tools-browser.cjs && node tests/journal-notebook-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-notebook-evidence
          path: .test-output/journal/*.png
          if-no-files-found: ignore
          include-hidden-files: true
  video-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:video-studio
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-studio-media-evidence
          path: |
            .test-output/creator-studio*.mp4
            .test-output/creator-video-studio.png
            .test-output/creator-studio-clean.png
          if-no-files-found: ignore
          include-hidden-files: true
  creator:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/creator*.mjs
      - run: node tests/creator-storyboard-browser.cjs && node tests/creator-history-browser.cjs && node tests/creator-map-editor-browser.cjs && node tests/creator-map-animation-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-workbench-evidence
          path: .test-output/creator*.png
          if-no-files-found: ignore
          include-hidden-files: true
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            react/package-lock.json
            functions/package-lock.json
      - name: Choose verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "level=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Ev '^(react/src/dashboard-guide\.css|react/v2/(ConstellationNav|PageIcon)\.jsx|v2/)' "$RUNNER_TEMP/changed-files.txt" | grep -q .; then
            echo "level=full" >> "$GITHUB_OUTPUT"
          else
            echo "level=cosmetic" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed files:"
          cat "$RUNNER_TEMP/changed-files.txt"
      - run: npm ci
      - run: npm ci --prefix react
      - name: Install Functions dependencies
        if: steps.scope.outputs.level == 'full'
        run: npm ci --prefix functions
      - name: Install Chromium
        if: steps.scope.outputs.level == 'cosmetic'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium and Firefox
        if: steps.scope.outputs.level == 'full'
        run: npx playwright install --with-deps chromium firefox
      - name: Run focused V2 unit tests
        if: steps.scope.outputs.level == 'cosmetic'
        run: npm run test:v2
      - name: Run full unit and Functions tests
        if: steps.scope.outputs.level == 'full'
        run: npm run test
      - run: npm run build:v2
      - run: npm run stage:v2
      - name: Check publishing files match source
        run: git diff --exit-code -- v2
      - name: Build production app
        if: steps.scope.outputs.level == 'full'
        run: npm run build
      - run: npm run check
      - name: V2 cosmetic dashboard smoke check
        if: steps.scope.outputs.level == 'cosmetic'
        run: npm run test:v2:smoke
        env:
          V2_BUILD_DIR: v2
      - name: Full V2 browser coverage
        if: steps.scope.outputs.level == 'full'
        run: npm run test:v2:browser
        env:
          V2_BUILD_DIR: v2
      - name: V1 browser regressions
        if: steps.scope.outputs.level == 'full'
        run: |
          export CHROMIUM_EXECUTABLE="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run test:browser
      - name: LIC presentation playback and fixed audio controls
        if: steps.scope.outputs.level == 'full'
        run: node tests/lic-opening-browser.cjs && node tests/lic-business-events-browser.cjs && node tests/lic-journey-browser.cjs
        env:
          LIC_BASELINE_REF: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-browser-evidence
          path: .test-output/**/*.png
          if-no-files-found: ignore
          include-hidden-files: true

  creator-universal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            react/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix react
      - run: npx playwright install --with-deps chrome
      - run: npm run test:universal-map && npm run test:map-defaults
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - run: npm run test:creator:rules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-universal-evidence
          path: |
            .test-output/default-style*
            firestore-debug.log
          if-no-files-found: ignore
          include-hidden-files: true

  creator-tts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions-tts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-tts-evidence
          path: .test-output/tts/*.png
          include-hidden-files: true
