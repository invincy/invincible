<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invincible Local AI</title>
<style>body{margin:0;background:#071518;color:#edfafa;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.panel{width:min(680px,calc(100% - 32px));padding:24px;border:1px solid #24555b;border-radius:18px;background:#0b2227;box-shadow:0 20px 60px #0008}h1{margin-top:0;color:#70e6f2}#log{min-height:220px;max-height:45vh;overflow:auto;padding:12px;border-radius:12px;background:#051014;white-space:pre-wrap}.row{display:flex;gap:10px;margin-top:14px}input{flex:1;padding:13px;border-radius:10px;border:1px solid #396d72;background:#071518;color:#fff}button{padding:0 18px;border:0;border-radius:10px;background:#f4c768;color:#071518;font-weight:700;cursor:pointer}</style></head>
<body><main class="panel"><h1>Invincible Local AI</h1><p>Local-only Qwen3 command controller.</p><div id="log">Ready. Try: “Invincible, create a new Panipat project.”</div><form class="row"><input id="message" maxlength="4000" autocomplete="off" placeholder="Tell Invincible what to do…"><button>Send</button></form></main>
<script>const log=document.querySelector('#log'),input=document.querySelector('#message');document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;log.textContent+=`\n\nYou: ${message}\nInvincible: working…`;input.value='';try{const r=await fetch('/api/command',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});const data=await r.json();log.textContent+=`\n${r.ok?JSON.stringify(data.result||data,null,2):data.error}`}catch(error){log.textContent+='\nLocal agent unavailable. Start the Invincible Local AI service and try again.'}});</script></body></html>
